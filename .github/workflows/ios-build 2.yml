                                  let isActive = (cue.id == dubbingEngine.activeCueID)
                                  Button {
                                      dubbingEngine.stopImmediately()
                                      playerController.seek(to: cue.startTime)
                                  } label: {
                                      VStack(alignment: .leading, spacing: 6) {
