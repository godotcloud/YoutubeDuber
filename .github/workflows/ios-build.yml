              static func isMostlyChinese(_ text: String) -> Bool {
                  let trimmed = text.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !trimmed.isEmpty else { return false }
                  // 若包含 2 个以上连续 3 字母以上的英文单词，判定为需要翻译成中文的外语/双语字幕
                  if let enRegex = try? NSRegularExpression(pattern: "[a-zA-Z]{3,}\\s+[a-zA-Z]{3,}", options: []),
                     enRegex.firstMatch(in: trimmed, options: [], range: NSRange(location: 0, length: (trimmed as NSString).length)) != nil {
                      return false
                  }
                  var hanCount = 0
                  for scalar in trimmed.unicodeScalars {
                      if (0x4E00...0x9FFF).contains(scalar.value) {
                          hanCount += 1
                      }
                  }
                  return Double(hanCount) / Double(max(1, trimmed.count)) >= 0.35
              }

