              func setupCallbacks() {
                  dubbingEngine.bindHandlers(
                      volumeDuck: { targetVol in
                          playerController.setOriginalVolume(targetVol)
                      },
                      tempSpeedFactor: { factor in
                          playerController.setTemporarySyncSpeedFactor(factor)
                      },
                      webKitSpeak: { text, lang, rate, pitch in
                          playerController.speakViaWebKit(text: text, lang: lang, rate: rate, pitch: pitch)
                      },
                      webKitStop: {
                          playerController.stopWebKitSpeech()
                      }
                  )

                  playerController.onWebKitSpeechEnded = {
                      dubbingEngine.handleUtteranceCompleted()
                  }

                  playerController.onTimeTick = { currentTime, state in
                      dubbingEngine.syncWithPlayback(
                          currentTime: currentTime,
                          playerState: state,
                          videoPlaybackRate: playerController.userSelectedSpeed,
                          cues: cues,
                          apiKey: apiKey,
                          ttsBaseURL: baseURL
                      )
                  }

                  playerController.onStateChange = { state in
                      // 仅在视频真正结束时立即停止配音；短暂 buffering 或瞬态 pause 由 syncWithPlayback 防抖处理，避免误断配音
                      if state == .ended {
                          dubbingEngine.stopImmediately()
                      }
                  }

                  playerController.onWebViewCaptionsCaptured = { rawPayload, translatedPayload, isChinese in
                      // 始终保留 YouTube 已返回的 translatedPayload (tlang=zh-Hans) 作为 0 秒即时中文配音种子，再由后台上下文翻译无缝升级！
                      let parsed = transcriptService.parseRawCaptionPayload(
                          rawPayload,
                          translatedRawText: translatedPayload,
                          alreadyChinese: isChinese
                      )
                      guard !parsed.isEmpty else { return }
                      if self.cues.count <= 2 {
                          self.cues = parsed
                          self.isLoadingCaptions = false
                          self.translationTask?.cancel()
                          self.translationTask = Task {
                              await translateLoadedCues(parsed)
                          }
                      }
                  }
              }

              func handleSmartTopInput() {
                  let input = urlInput.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !input.isEmpty else { return }
                  Task {
                      if let parsed = await YouTubePlayerController.parseInput(input) {
                          activeTab = .subtitles
                          startPlaying(platform: parsed.platform, videoID: parsed.videoID)
                      } else {
                          searchQuery = input
                          activeTab = .search
                          performVideoSearch()
                      }
                  }
              }

              func performVideoSearch() {
                  let q = searchQuery.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !q.isEmpty else { return }
                  isSearching = true
                  Task {
                      let results = await transcriptService.searchVideos(keyword: q, platform: searchPlatform)
                      self.searchResults = results
                      self.isSearching = false
                  }
              }

              func selectAndPlayVideoItem(_ item: VideoItem) {
                  urlInput = item.watchURLString
                  playerController.currentTitle = item.title
                  playerController.currentAuthor = item.author
                  playerController.currentCoverURL = item.customCoverURL
                  activeTab = .subtitles
                  startPlaying(platform: item.platform, videoID: item.videoID)
              }

              func startPlaying(platform: VideoPlatform, videoID: String) {
                  translationTask?.cancel()
                  dubbingEngine.stopImmediately()
                  dubbingEngine.clearPrefetchCache()
                  cues = []
                  playerController.loadVideo(platform: platform, id: videoID)
                  translationTask = Task {
                      await fetchAndTranslateSubtitles(for: videoID, platform: platform)
                  }
              }

              func retranslateCurrentCues(for targetProvider: TranslationProvider? = nil) {
                  guard !cues.isEmpty else { return }
                  let activeProvider = targetProvider ?? selectedTranslationProvider
                  translationTask?.cancel()
                  dubbingEngine.stopImmediately()
                  dubbingEngine.clearPrefetchCache()

                  if activeProvider == .youtubeBuiltIn {
                      // 若切换回「官方内译」，优先恢复缓存的平台原生直译，缺失部分再由后台补齐
                      for i in 0..<cues.count {
                          cues[i].translatedZH = cues[i].initialPlatformZH
                          cues[i].translatedByProvider = cues[i].initialPlatformZH != nil ? "官方内译" : nil
                      }
                  } else {
                      for i in 0..<cues.count {
                          cues[i].translatedZH = nil
                          cues[i].translatedByProvider = nil
                      }
                  }

                  let snapshot = cues
                  statusMessage = "已切换为【\(activeProvider.shortLabel)】，正在优先重译当前播放位置..."
                  translationTask = Task {
                      await translateLoadedCues(snapshot, explicitProvider: activeProvider)
                  }
              }

              func fetchAndTranslateSubtitles(for videoID: String, platform: VideoPlatform) async {
                  isLoadingCaptions = true
                  statusMessage = "正在提取 \(platform.rawValue) 字幕/弹幕与同作者推荐..."
                  do {
                      // 始终请求内置中文字幕种子 (preferYouTubeBuiltInTranslation: true)，确保第 0 秒起即可立刻发声配音，随后再由上下文翻译器后台精修！
                      let result = try await transcriptService.fetchMergedCues(
                          for: videoID,
                          platform: platform,
                          preferYouTubeBuiltInTranslation: true
                      )
                      if let title = result.title, !title.isEmpty {
                          playerController.currentTitle = title
                      }
                      if let author = result.author, !author.isEmpty {
                          playerController.currentAuthor = author
                      }
                      if let cid = result.channelID, !cid.isEmpty {
                          playerController.currentChannelID = cid
                      }
                      if let cover = result.coverURL, !cover.isEmpty {
                          playerController.currentCoverURL = cover
                      }
                      if !result.channelVideos.isEmpty {
                          playerController.relatedVideos = result.channelVideos
                      }
                      guard self.cues.isEmpty else { return }
                      self.cues = result.cues
                      isLoadingCaptions = false
                      await translateLoadedCues(result.cues)
                  } catch {
                      if cues.isEmpty {
                          isLoadingCaptions = false
                          statusMessage = error.localizedDescription
                      }
                  }
              }

              /// 播放指针跟随式上下文同传翻译：
              /// 无论视频长达 5 分钟还是 60 分钟，始终优先翻译当前播放时间 (`playerController.currentTime`) 所在的批次，随看随译、零等待！
              func translateLoadedCues(_ loadedCues: [SubtitleCue], explicitProvider: TranslationProvider? = nil) async {
                  guard !loadedCues.isEmpty else { return }
                  let activeProvider = explicitProvider ?? selectedTranslationProvider

                  let batchSize = 8
                  let totalBatches = (loadedCues.count + batchSize - 1) / batchSize
                  guard totalBatches > 0 else { return }

                  let alreadyDoneCount = cues.filter { !($0.translatedZH ?? "").isEmpty }.count
                  if alreadyDoneCount == cues.count && activeProvider == .youtubeBuiltIn {
                      statusMessage = "官方内译台词已全部就绪 (\(cues.count) 句)"
                      return
                  }

                  statusMessage = "正在通过【\(activeProvider.shortLabel)】优先翻译当前播放进度..."
                  let forceUpgrade = (activeProvider != .youtubeBuiltIn)
                  var completedBatches: Set<Int> = []

                  while completedBatches.count < totalBatches {
                      if Task.isCancelled { return }
                      guard !cues.isEmpty else { return }

                      let playhead = playerController.currentTime
                      let playheadCueIdx = cues.firstIndex(where: { $0.endTime >= playhead }) ?? 0
                      let preferredBatch = min(totalBatches - 1, max(0, playheadCueIdx / batchSize))

                      var chosenBatch: Int? = nil
                      if !completedBatches.contains(preferredBatch) {
                          chosenBatch = preferredBatch
                      } else {
                          for offset in 1..<totalBatches {
                              let forward = preferredBatch + offset
                              if forward < totalBatches && !completedBatches.contains(forward) {
                                  chosenBatch = forward
                                  break
                              }
                              let backward = preferredBatch - offset
                              if backward >= 0 && !completedBatches.contains(backward) {
                                  chosenBatch = backward
                                  break
                              }
                          }
                      }

                      guard let batchIdx = chosenBatch else { break }
                      completedBatches.insert(batchIdx)

                      let start = batchIdx * batchSize
                      let end = min(start + batchSize, cues.count)
                      guard start < end, end <= cues.count else { continue }

                      let slice = Array(cues[start..<end])
                      let beforeStart = max(0, start - 3)
                      let contextBefore = start > 0 ? Array(cues[beforeStart..<start]) : []
                      let afterEnd = min(cues.count, end + 2)
                      let contextAfter = end < cues.count ? Array(cues[end..<afterEnd]) : []

                      let translatedRichMap = await transcriptService.translateBatchWithProviderBadge(
                          cues: slice,
                          contextBefore: contextBefore,
                          contextAfter: contextAfter,
                          videoTitle: playerController.currentTitle,
                          videoAuthor: playerController.currentAuthor,
                          provider: activeProvider,
                          apiKey: apiKey,
                          baseURL: baseURL,
                          model: llmModel,
                          forceContextualUpgrade: forceUpgrade
                      )
                      if Task.isCancelled { return }
                      for i in start..<end where i < cues.count {
                          if let item = translatedRichMap[cues[i].id], !item.text.isEmpty {
                              cues[i].translatedZH = item.text
                              cues[i].translatedByProvider = item.badge
                          }
                      }
                      let doneCues = min(cues.count, completedBatches.count * batchSize)
                      statusMessage = "【\(activeProvider.shortLabel)】已翻译 (\(doneCues)/\(cues.count) 句)"
                  }
              }

              func loadFavoritesFromStorage() {
                  guard let data = favoriteVideosJSON.data(using: .utf8),
                        let decoded = try? JSONDecoder().decode([VideoItem].self, from: data) else {
                      return
                  }
                  favorites = decoded
              }

              func saveFavoritesToStorage() {
                  if let data = try? JSONEncoder().encode(favorites),
                     let str = String(data: data, encoding: .utf8) {
                      favoriteVideosJSON = str
                  }
              }

              func toggleFavoriteCurrentVideo() {
                  if let idx = favorites.firstIndex(where: { $0.videoID == playerController.currentVideoID && $0.platform == playerController.currentPlatform }) {
                      favorites.remove(at: idx)
                  } else {
                      let item = VideoItem(
                          platform: playerController.currentPlatform,
                          videoID: playerController.currentVideoID,
                          title: playerController.currentTitle,
                          author: playerController.currentAuthor,
                          channelID: playerController.currentChannelID,
                          customCoverURL: playerController.currentCoverURL
                      )
                      favorites.insert(item, at: 0)
                  }
                  saveFavoritesToStorage()
              }

              func deleteFavorites(at offsets: IndexSet) {
                  favorites.remove(atOffsets: offsets)
                  saveFavoritesToStorage()
              }

              func formatTimestamp(_ seconds: TimeInterval) -> String {
                  let total = max(0, Int(seconds))
                  let mins = total / 60
                  let secs = total % 60
                  return String(format: "%02d:%02d", mins, secs)
              }
          }
