              /// 播放器每 100ms 时间同步入口
              func syncWithPlayback(
                  currentTime: TimeInterval,
                  playerState: YTPlayerState,
                  videoPlaybackRate: Double,
                  cues: [SubtitleCue],
                  apiKey: String,
                  ttsBaseURL: String
              ) {
                  guard isDubbingEnabled else { return }

                  latestPlaybackTime = currentTime
                  latestVideoRate = videoPlaybackRate
                  latestAPIKey = apiKey
                  latestTTSBaseURL = ttsBaseURL

                  if playerState != .playing {
                      if isSpeaking {
                          stopImmediately()
                      }
                      return
                  }

                  // 提前 0.18s 匹配字幕以抵消音频硬件启动耗时
                  guard let currentIdx = cues.firstIndex(where: {
                      currentTime >= ($0.startTime - 0.18) && currentTime < $0.endTime
                  }) else {
                      return
                  }

                  let currentCue = cues[currentIdx]
                  activeCueID = currentCue.id

                  // 后台提前预加载接下来 2 句的在线 TTS 音频，使得切入下一句时 0ms 延迟直接播放！
                  prefetchUpcomingCues(fromIndex: currentIdx, in: cues, apiKey: apiKey, baseURL: ttsBaseURL)

                  guard lastSpokenCueID != currentCue.id else { return }
                  guard let zhText = currentCue.translatedZH, !zhText.isEmpty else { return }

                  // 核心优化：如果上一句正在朗读且开启了「完整读完不中断保护」
                  if isSpeaking && preventMidSentenceCutoff {
                      // 若还没有落后太多（落后不超过 5.5 秒），将新句排入 pendingCue 队列等待上一句自然读完后无缝衔接！
                      if let activeSpeaking = currentlySpeakingCue,
                         currentTime - activeSpeaking.endTime < 5.5 {
                          pendingCue = currentCue
                          // 若开启了智能视频微慢放协同，临时将视频速率降为 0.78x 给当前长句留出收尾时间
                          if autoSlowVideoForLongSpeech {
                              onTempSpeedFactorChange?(0.78)
                          }
                          return
                      }
                  }

                  startSpeakingCue(currentCue)
              }

              private func startSpeakingCue(_ cue: SubtitleCue) {
                  guard let zhText = cue.translatedZH, !zhText.isEmpty else { return }
                  lastSpokenCueID = cue.id
                  currentlySpeakingCue = cue
                  pendingCue = nil

                  let remainingWindow = max(1.0, (cue.endTime - latestPlaybackTime) / max(0.5, latestVideoRate))

                  if synthesizer.isSpeaking {
                      synthesizer.stopSpeaking(at: .immediate)
                  }
                  audioPlayer?.stop()

                  isSpeaking = true
                  onVolumeDuckChange?(Int(duckedOriginalVolume))

                  let charCount = Double(zhText.count)
                  let estimatedSeconds = max(1.0, charCount / 4.2)
                  // 计算自适应语速：当句较长或接续较晚时适度提速 (最高 1.42x)，既读完句子又不拖慢节奏
                  let adaptiveSpeed = min(1.42, max(0.95, (estimatedSeconds / remainingWindow) * baseSpeechRateMultiplier))

                  switch voiceEngine {
                  case .edgeFreeNeuralTTS:
                      Task {
                          await speakViaEdgeFreeNeuralTTS(cue: cue, text: zhText, speed: adaptiveSpeed, targetDuration: remainingWindow)
                      }
                  case .googleFreeStreamTTS:
                      Task {
                          await speakViaGoogleFreeTTS(cue: cue, text: zhText, speed: adaptiveSpeed, targetDuration: remainingWindow)
                      }
                  case .applePremiumTTS:
                      speakViaAppleNeuralVoice(text: zhText, adaptiveSpeed: adaptiveSpeed)
                  case .webKitSpeechTTS:
                      onWebKitSpeak?(zhText, webKitVoicePreset.lang, adaptiveSpeed, webKitVoicePreset.pitch)
                  case .neuralCloudTTS:
                      if !latestAPIKey.trimmingCharacters(in: .whitespaces).isEmpty {
                          Task {
                              await speakViaCloudNeuralTTS(
                                  cue: cue,
                                  text: zhText,
                                  speed: adaptiveSpeed,
                                  targetDuration: remainingWindow,
                                  apiKey: latestAPIKey,
                                  baseURL: latestTTSBaseURL
                              )
                          }
                      } else {
                          Task {
                              await speakViaEdgeFreeNeuralTTS(cue: cue, text: zhText, speed: adaptiveSpeed, targetDuration: remainingWindow)
                          }
                      }
                  }
              }

              /// 当一句配音自然播放完毕时调用：若队列中有等待的 `pendingCue`，立即无缝衔接播放！
              func handleUtteranceCompleted() {
                  if let next = pendingCue {
                      pendingCue = nil
                      // 若该待播句尚未过期超过 3.5 秒，立即播报它
                      if latestPlaybackTime < next.endTime + 3.5 {
                          startSpeakingCue(next)
                          return
                      }
                  }
                  isSpeaking = false
                  currentlySpeakingCue = nil
                  onVolumeDuckChange?(100)
                  onTempSpeedFactorChange?(1.0)
              }

              // MARK: - 提前预加载下两句音频缓存 (消除网络 TTS 延迟导致的尾音截断)
              private func cacheKey(for cueID: UUID) -> String {
                  "\(cueID.uuidString)|\(voiceEngine.rawValue)|\(currentVoiceShortName)"
              }

              private func prefetchUpcomingCues(fromIndex idx: Int, in cues: [SubtitleCue], apiKey: String, baseURL: String) {
                  guard voiceEngine == .edgeFreeNeuralTTS || voiceEngine == .googleFreeStreamTTS || voiceEngine == .neuralCloudTTS else {
                      return
                  }
                  let lookaheadIndices = [idx, idx + 1, idx + 2].filter { $0 >= 0 && $0 < cues.count }
                  for i in lookaheadIndices {
                      let cue = cues[i]
                      guard let zh = cue.translatedZH, !zh.isEmpty else { continue }
                      let key = cacheKey(for: cue.id)
                      guard prefetchedAudioCache[key] == nil, !prefetchingKeys.contains(key) else { continue }
                      prefetchingKeys.insert(key)

                      let engine = self.voiceEngine
                      let edgeV = self.edgeVoice
                      let googleV = self.googleVoicePreset
                      let aiV = self.aiCloudVoicePreset

                      Task {
                          if let data = await Self.downloadTTSData(
                              text: zh,
                              engine: engine,
                              edgeVoice: edgeV,
                              googlePreset: googleV,
                              aiPreset: aiV,
                              apiKey: apiKey,
                              baseURL: baseURL
                          ) {
                              self.prefetchedAudioCache[key] = data
                          }
                          self.prefetchingKeys.remove(key)
                      }
                  }
              }

              static func downloadTTSData(
                  text: String,
                  engine: DubbingVoiceEngine,
                  edgeVoice: EdgeChineseVoice,
                  googlePreset: GoogleVoicePreset,
                  aiPreset: AICloudVoicePreset,
                  apiKey: String,
                  baseURL: String
              ) async -> Data? {
                  switch engine {
                  case .edgeFreeNeuralTTS:
                      if let encodedText = text.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                         let encodedVoice = edgeVoice.rawValue.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                         let url = URL(string: "https://tts.travisvn.com/?text=\(encodedText)&voice=\(encodedVoice)") {
                          var req = URLRequest(url: url)
                          req.timeoutInterval = 3.5
                          if let (data, resp) = try? await URLSession.shared.data(for: req),
                             let http = resp as? HTTPURLResponse, http.statusCode == 200, data.count > 256 {
                              return data
                          }
                      }
                      return await downloadGoogleTTSData(text: text, langCode: "zh-CN")

                  case .googleFreeStreamTTS:
                      return await downloadGoogleTTSData(text: text, langCode: googlePreset.langCode)

                  case .neuralCloudTTS:
                      let cleanBase = baseURL.trimmingCharacters(in: CharacterSet(charactersIn: "/"))
                      guard !apiKey.isEmpty, let url = URL(string: "\(cleanBase)/audio/speech") else {
                          return await downloadGoogleTTSData(text: text, langCode: "zh-CN")
                      }
                      var request = URLRequest(url: url)
                      request.httpMethod = "POST"
                      request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                      request.setValue("Bearer \(apiKey)", forHTTPHeaderField: "Authorization")

                      let isCosy = aiPreset.rawValue.contains("CosyVoice")
                      let payload: [String: Any] = [
                          "model": isCosy ? "FunAudioLLM/CosyVoice2-0.5B" : "tts-1",
                          "input": text,
                          "voice": aiPreset.rawValue,
                          "response_format": "mp3",
                          "speed": 1.05
                      ]
                      request.httpBody = try? JSONSerialization.data(withJSONObject: payload)
                      if let (data, resp) = try? await URLSession.shared.data(for: request),
                         let http = resp as? HTTPURLResponse, http.statusCode == 200, data.count > 256 {
                          return data
                      }
                      return await downloadGoogleTTSData(text: text, langCode: "zh-CN")

                  default:
                      return nil
                  }
              }

              static func downloadGoogleTTSData(text: String, langCode: String) async -> Data? {
                  guard let encoded = text.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                        let url = URL(string: "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=\(langCode)&q=\(encoded)") else {
                      return nil
                  }
                  var request = URLRequest(url: url)
                  request.timeoutInterval = 3.5
                  request.setValue(
                      "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148",
                      forHTTPHeaderField: "User-Agent"
                  )
                  if let (data, resp) = try? await URLSession.shared.data(for: request),
                     let http = resp as? HTTPURLResponse, http.statusCode == 200, data.count > 256 {
                      return data
                  }
                  return nil
              }

              /// 播放二进制音频并根据【真实音频秒数 player.duration】与【当前剩余时间窗】精准调整倍速，确保整句读完！
              private func playSynthesizedAudioData(_ data: Data, cue: SubtitleCue, fallbackText: String, fallbackSpeed: Double) -> Bool {
                  do {
                      let player = try AVAudioPlayer(data: data)
                      player.delegate = self
                      player.enableRate = true

                      // 计算此刻距离该句字幕结束还剩多少秒（至少给 1.0s）
                      let nowWindow = max(1.0, (cue.endTime - latestPlaybackTime) / max(0.5, latestVideoRate))
                      let actualAudioDuration = max(0.5, player.duration)
                      let neededRate = (actualAudioDuration / nowWindow) * baseSpeechRateMultiplier

                      // 若 Google 预设带有语速风格修饰，叠加进去
                      var styleFactor = 1.0
                      if voiceEngine == .googleFreeStreamTTS {
                          if googleVoicePreset == .mandarinWarm { styleFactor = 0.94 }
                          if googleVoicePreset == .mandarinBright { styleFactor = 1.08 }
                      }

                      player.rate = Float(min(1.45, max(0.92, neededRate * styleFactor)))
                      player.prepareToPlay()
                      player.play()
                      self.audioPlayer = player
                      return true
                  } catch {
                      return false
                  }
              }

              /// 通道 1：微软 Edge 免费神经语音
              func speakViaEdgeFreeNeuralTTS(cue: SubtitleCue, text: String, speed: Double, targetDuration: TimeInterval) async {
                  let key = cacheKey(for: cue.id)
                  if let cached = prefetchedAudioCache[key] {
                      if playSynthesizedAudioData(cached, cue: cue, fallbackText: text, fallbackSpeed: speed) {
                          return
                      }
                  }
                  if let downloaded = await Self.downloadTTSData(
                      text: text,
                      engine: .edgeFreeNeuralTTS,
                      edgeVoice: edgeVoice,
                      googlePreset: googleVoicePreset,
                      aiPreset: aiCloudVoicePreset,
                      apiKey: latestAPIKey,
                      baseURL: latestTTSBaseURL
                  ) {
                      prefetchedAudioCache[key] = downloaded
                      if playSynthesizedAudioData(downloaded, cue: cue, fallbackText: text, fallbackSpeed: speed) {
                          return
                      }
                  }
                  speakViaAppleNeuralVoice(text: text, adaptiveSpeed: speed)
              }

              /// 通道 2：Google Translate TTS 免费流式语音
              func speakViaGoogleFreeTTS(cue: SubtitleCue, text: String, speed: Double, targetDuration: TimeInterval) async {
                  let key = cacheKey(for: cue.id)
                  if let cached = prefetchedAudioCache[key] {
                      if playSynthesizedAudioData(cached, cue: cue, fallbackText: text, fallbackSpeed: speed) {
                          return
                      }
                  }
                  if let downloaded = await Self.downloadGoogleTTSData(text: text, langCode: googleVoicePreset.langCode) {
                      prefetchedAudioCache[key] = downloaded
                      if playSynthesizedAudioData(downloaded, cue: cue, fallbackText: text, fallbackSpeed: speed) {
                          return
                      }
                  }
                  speakViaAppleNeuralVoice(text: text, adaptiveSpeed: speed)
              }

              /// 通道 3：iPhone 原生 AVSpeechSynthesizer（支持自定义发音人 + 4 款声线音调风格）
              func speakViaAppleNeuralVoice(text: String, adaptiveSpeed: Double) {
                  let utterance = AVSpeechUtterance(string: text)
                  if !selectedAppleVoiceIdentifier.isEmpty,
                     let customVoice = AVSpeechSynthesisVoice(identifier: selectedAppleVoiceIdentifier) {
                      utterance.voice = customVoice
                  } else {
                      utterance.voice = Self.selectBestChineseVoice()
                  }

                  let defaultRate = Double(AVSpeechUtteranceDefaultSpeechRate)
                  utterance.rate = Float(min(0.64, max(0.45, defaultRate * adaptiveSpeed)))
                  utterance.pitchMultiplier = applePitchStyle.pitchValue
                  utterance.volume = 1.0
                  utterance.preUtteranceDelay = 0.0
                  utterance.postUtteranceDelay = 0.01

                  synthesizer.speak(utterance)
              }

              /// 通道 5：AI 大模型云端语音
              func speakViaCloudNeuralTTS(
                  cue: SubtitleCue,
                  text: String,
                  speed: Double,
                  targetDuration: TimeInterval,
                  apiKey: String,
                  baseURL: String
              ) async {
                  let key = cacheKey(for: cue.id)
                  if let cached = prefetchedAudioCache[key] {
                      if playSynthesizedAudioData(cached, cue: cue, fallbackText: text, fallbackSpeed: speed) {
                          return
                      }
                  }
                  if let downloaded = await Self.downloadTTSData(
                      text: text,
                      engine: .neuralCloudTTS,
                      edgeVoice: edgeVoice,
                      googlePreset: googleVoicePreset,
                      aiPreset: aiCloudVoicePreset,
                      apiKey: apiKey,
                      baseURL: baseURL
                  ) {
                      prefetchedAudioCache[key] = downloaded
                      if playSynthesizedAudioData(downloaded, cue: cue, fallbackText: text, fallbackSpeed: speed) {
                          return
                      }
                  }
                  speakViaAppleNeuralVoice(text: text, adaptiveSpeed: speed)
              }

              static func selectBestChineseVoice() -> AVSpeechSynthesisVoice? {
                  let zhVoices = AVSpeechSynthesisVoice.speechVoices().filter {
                      $0.language.lowercased().hasPrefix("zh-cn")
                  }
                  if let premium = zhVoices.first(where: { $0.quality == .premium }) {
                      return premium
                  }
                  if let enhanced = zhVoices.first(where: { $0.quality == .enhanced }) {
                      return enhanced
                  }
                  return AVSpeechSynthesisVoice(language: "zh-CN")
              }

              nonisolated func speechSynthesizer(
                  _ synthesizer: AVSpeechSynthesizer,
                  didFinish utterance: AVSpeechUtterance
              ) {
                  Task { @MainActor in
                      self.handleUtteranceCompleted()
                  }
              }

              nonisolated func speechSynthesizer(
                  _ synthesizer: AVSpeechSynthesizer,
                  didCancel utterance: AVSpeechUtterance
              ) {
                  Task { @MainActor in
                      if self.pendingCue == nil {
                          self.isSpeaking = false
                          self.onVolumeDuckChange?(100)
                          self.onTempSpeedFactorChange?(1.0)
                      }
                  }
              }

              nonisolated func audioPlayerDidFinishPlaying(_ player: AVAudioPlayer, successfully flag: Bool) {
                  Task { @MainActor in
                      self.handleUtteranceCompleted()
                  }
              }
          }
