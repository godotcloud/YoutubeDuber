          import SwiftUI

          struct ContentView: View {
              @StateObject private var playerController = YouTubePlayerController()
              @StateObject private var dubbingEngine = RealtimeChineseDubbingEngine()

              @State private var urlInput: String = "https://www.youtube.com/watch?v=aircAruvnKk"
              @State private var cues: [SubtitleCue] = []
              @State private var isLoadingCaptions: Bool = false
              @State private var statusMessage: String = "准备就绪：加载视频后将自动提取字幕并开启实时中文配音"
              @State private var showSettings: Bool = false

              @AppStorage("openai_api_key") private var apiKey: String = ""
              @AppStorage("openai_base_url") private var baseURL: String = "https://api.openai.com/v1"
              @AppStorage("openai_model") private var llmModel: String = "gpt-4o-mini"

              private let transcriptService = TranscriptAndTranslationService()

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 0) {
                          // 1. 顶部 YouTube URL 输入栏
                          HStack(spacing: 10) {
                              Image(systemName: "play.rectangle.fill")
                                  .foregroundStyle(.red)
                              TextField("粘贴 YouTube 视频链接或 11 位 Video ID", text: $urlInput)
                                  .textInputAutocapitalization(.never)
                                  .disableAutocorrection(true)
                                  .font(.subheadline)
                                  .submitLabel(.go)
                                  .onSubmit { loadNewVideo() }

                              Button("加载配音") {
                                  loadNewVideo()
                              }
                              .buttonStyle(.borderedProminent)
                              .tint(.red)
                              .controlSize(.small)
                          }
                          .padding(.horizontal, 14)
                          .padding(.vertical, 10)
                          .background(Color(.secondarySystemBackground))

                          // 2. 16:9 YouTube 原生移动网页播放器（彻底解决 152-4 嵌入限制）
                          ZStack(alignment: .bottomTrailing) {
                              YouTubeWebPlayerView(controller: playerController)
                                  .aspectRatio(16.0 / 9.0, contentMode: .fit)
                                  .background(Color.black)

                              if dubbingEngine.isSpeaking {
                                  Label("中文同传配音中", systemImage: "waveform.circle.fill")
                                      .font(.caption.bold())
                                      .padding(.horizontal, 10)
                                      .padding(.vertical, 5)
                                      .background(.ultraThinMaterial)
                                      .clipShape(Capsule())
                                      .padding(10)
                              }
                          }

                          // 3. 实时配音状态与快捷控制栏
                          HStack(spacing: 12) {
                              Toggle(isOn: $dubbingEngine.isDubbingEnabled) {
                                  Label("实时中文配音", systemImage: dubbingEngine.isDubbingEnabled ? "speaker.wave.3.fill" : "speaker.slash.fill")
                                      .font(.subheadline.weight(.semibold))
                              }
                              .toggleStyle(.button)
                              .tint(dubbingEngine.isDubbingEnabled ? .green : .gray)
                              .onChange(of: dubbingEngine.isDubbingEnabled) { _, enabled in
                                  if !enabled { dubbingEngine.stopImmediately() }
                              }

                              Spacer()

                              if isLoadingCaptions {
                                  ProgressView()
                                      .controlSize(.small)
                              }

                              Text(statusMessage)
                                  .font(.caption)
                                  .foregroundStyle(.secondary)
                                  .lineLimit(1)
                          }
                          .padding(.horizontal, 14)
                          .padding(.vertical, 8)
                          .background(Color(.systemBackground))

                          Divider()

                          // 4. 实时滚动双语时间轴字幕列表
                          ScrollViewReader { proxy in
                              List(cues) { cue in
                                  let isActive = (cue.id == dubbingEngine.activeCueID)
                                  Button {
                                      dubbingEngine.stopImmediately()
                                      playerController.seek(to: cue.startTime)
                                  } label: {
                                      VStack(alignment: .leading, spacing: 6) {
                                          HStack {
                                              Text(formatTimestamp(cue.startTime))
                                                  .font(.caption2.monospacedDigit())
                                                  .padding(.horizontal, 6)
                                                  .padding(.vertical, 2)
                                                  .background(isActive ? Color.red.opacity(0.18) : Color.secondary.opacity(0.12))
                                                  .foregroundStyle(isActive ? .red : .secondary)
                                                  .clipShape(RoundedRectangle(cornerRadius: 4))

                                              if isActive {
                                                  Image(systemName: "waveform")
                                                      .font(.caption2)
                                                      .foregroundStyle(.red)
                                              }
                                              Spacer()
                                          }

                                          Text(cue.translatedZH ?? "正在翻译中文字幕...")
                                              .font(.body.weight(isActive ? .semibold : .regular))
                                              .foregroundStyle(cue.translatedZH == nil ? .secondary : .primary)

                                          Text(cue.originalText)
                                              .font(.caption)
                                              .foregroundStyle(.secondary)
                                      }
                                      .padding(.vertical, 4)
                                  }
                                  .listRowBackground(isActive ? Color.red.opacity(0.08) : Color.clear)
                                  .id(cue.id)
                              }
                              .listStyle(.plain)
                              .onChange(of: dubbingEngine.activeCueID) { _, newID in
                                  guard let newID else { return }
                                  withAnimation(.easeInOut(duration: 0.25)) {
                                      proxy.scrollTo(newID, anchor: .center)
                                  }
                              }
                          }
                      }
                      .navigationTitle("YT 实时中文配音")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .topBarLeading) {
                              Button {
                                  playerController.toggleCleanLayout()
                              } label: {
                                  Image(systemName: playerController.isCleanPlayerLayout ? "rectangle.expand.vertical" : "rectangle.compress.vertical")
                              }
                          }
                          ToolbarItem(placement: .topBarTrailing) {
                              Button {
                                  showSettings = true
                              } label: {
                                  Image(systemName: "slider.horizontal.3")
                              }
                          }
                      }
                      .sheet(isPresented: $showSettings) {
                          SettingsSheetView(
                              dubbingEngine: dubbingEngine,
                              apiKey: $apiKey,
                              baseURL: $baseURL,
                              llmModel: $llmModel
                          )
                      }
                      .task {
                          setupCallbacks()
                          await fetchAndTranslateSubtitles(for: playerController.currentVideoID)
                      }
                  }
              }

              func setupCallbacks() {
                  dubbingEngine.bindVolumeDuckHandler { targetVol in
                      playerController.setOriginalVolume(targetVol)
                  }

                  playerController.onTimeTick = { currentTime, state in
                      dubbingEngine.syncWithPlayback(
                          currentTime: currentTime,
                          playerState: state,
                          videoPlaybackRate: playerController.playbackRate,
                          cues: cues,
                          apiKey: apiKey,
                          ttsBaseURL: baseURL
                      )
                  }

                  playerController.onStateChange = { state in
                      if state == .paused || state == .buffering || state == .ended {
                          dubbingEngine.stopImmediately()
                      }
                  }

                  // 当 WKWebView 同源脚本捕获到字幕数据时，若当前列表为空则自动注入并触发流式中文翻译
                  playerController.onWebViewCaptionsCaptured = { rawPayload, isChinese in
                      guard self.cues.isEmpty else { return }
                      let parsed = transcriptService.parseRawCaptionPayload(rawPayload, alreadyChinese: isChinese)
                      guard !parsed.isEmpty else { return }
                      self.cues = parsed
                      self.isLoadingCaptions = false
                      Task {
                          await translateLoadedCues(parsed)
                      }
                  }
              }

              func loadNewVideo() {
                  guard let vid = YouTubePlayerController.extractVideoID(from: urlInput) else {
                      statusMessage = "链接格式无效，请输入有效的 YouTube URL 或 11 位 ID"
                      return
                  }
                  dubbingEngine.stopImmediately()
                  cues = []
                  playerController.loadVideo(id: vid)
                  Task {
                      await fetchAndTranslateSubtitles(for: vid)
                  }
              }

              func fetchAndTranslateSubtitles(for videoID: String) async {
                  isLoadingCaptions = true
                  statusMessage = "正在通过多通道提取 YouTube 时间轴字幕..."
                  do {
                      let fetched = try await transcriptService.fetchMergedCues(for: videoID)
                      guard self.cues.isEmpty else { return }
                      self.cues = fetched
                      isLoadingCaptions = false
                      await translateLoadedCues(fetched)
                  } catch {
                      // 若 InnerTube 通道受限，等待 WKWebView 同源脚本自动回传字幕
                      if cues.isEmpty {
                          isLoadingCaptions = false
                          statusMessage = error.localizedDescription
                      }
                  }
              }

              func translateLoadedCues(_ loadedCues: [SubtitleCue]) async {
                  statusMessage = "已加载 \(loadedCues.count) 句时间轴，正在流式生成中文配音台词..."
                  let batchSize = 20
                  for start in stride(from: 0, to: loadedCues.count, by: batchSize) {
                      let end = min(start + batchSize, loadedCues.count)
                      let slice = Array(loadedCues[start..<end])
                      if let translatedMap = try? await transcriptService.translateBatchToSpokenChinese(
                          cues: slice,
                          apiKey: apiKey,
                          baseURL: baseURL,
                          model: llmModel
                      ) {
                          for i in start..<end where i < cues.count {
                              if let zh = translatedMap[cues[i].id] {
                                  cues[i].translatedZH = zh
                              }
                          }
                      }
                      statusMessage = "实时配音就绪 (\(end)/\(loadedCues.count) 句已就绪)"
                  }
              }

              func formatTimestamp(_ seconds: TimeInterval) -> String {
                  let total = max(0, Int(seconds))
                  let mins = total / 60
                  let secs = total % 60
                  return String(format: "%02d:%02d", mins, secs)
              }
          }
          EOF_FILE
          cat << 'EOF_FILE' > YouTubeDubber/Views/SettingsSheetView.swift
          import SwiftUI

          struct SettingsSheetView: View {
              @ObservedObject var dubbingEngine: RealtimeChineseDubbingEngine
              @Binding var apiKey: String
              @Binding var baseURL: String
              @Binding var llmModel: String
              @Environment(\.dismiss) private var dismiss

              var body: some View {
                  NavigationStack {
                      Form {
                          Section("中文语音合成引擎") {
                              Picker("发音引擎", selection: $dubbingEngine.voiceEngine) {
                                  ForEach(DubbingVoiceEngine.allCases) { engine in
                                      Text(engine.rawValue).tag(engine)
                                  }
                              }

                              VStack(alignment: .leading) {
                                  HStack {
                                      Text("原视频压音比例 (Audio Ducking)")
                                      Spacer()
                                      Text("\(Int(dubbingEngine.duckedOriginalVolume))%")
                                          .foregroundStyle(.secondary)
                                  }
                                  Slider(value: $dubbingEngine.duckedOriginalVolume, in: 0...60, step: 2)
                              }

                              VStack(alignment: .leading) {
                                  HStack {
                                      Text("基准中文语速倍率")
                                      Spacer()
                                      Text(String(format: "%.2fx", dubbingEngine.baseSpeechRateMultiplier))
                                          .foregroundStyle(.secondary)
                                  }
                                  Slider(value: $dubbingEngine.baseSpeechRateMultiplier, in: 0.9...1.3, step: 0.02)
                              }
                          }

                          Section {
                              SecureField("API Key (选填，留空使用内置免费通道)", text: $apiKey)
                              TextField("API Base URL", text: $baseURL)
                                  .textInputAutocapitalization(.never)
                                  .disableAutocorrection(true)
                              TextField("翻译模型名称", text: $llmModel)
                                  .textInputAutocapitalization(.never)
                                  .disableAutocorrection(true)
                          } header: {
                              Text("AI 同传翻译与云端神经 TTS 配置")
                          } footer: {
                              Text("提示：iOS 设置 -> 辅助功能 -> 朗读内容 -> 声音 -> 中文（中国大陆）中下载「优化/高质 (Premium)」语音包后，离线原生发音同样极其自然流畅。")
                          }
                      }
                      .navigationTitle("配音与引擎设置")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .confirmationAction) {
                              Button("完成") { dismiss() }
                          }
                      }
                  }
              }
          }
          EOF_FILE

      - name: Verify macOS & Xcode Environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list devicetypes

      - name: Install XcodeGen & Generate .xcodeproj
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate --spec project.yml

      - name: Build for iOS Simulator (Debug Verification)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project YouTubeDubber.xcodeproj \
            -scheme YouTubeDubber \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedDataSimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build Unsigned iOS Device App & Package .ipa
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project YouTubeDubber.xcodeproj \
            -scheme YouTubeDubber \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p build/Payload
          cp -r build/DerivedDataDevice/Build/Products/Release-iphoneos/YouTubeDubber.app build/Payload/
          cd build
          zip -qry YouTubeDubber-Unsigned.ipa Payload
          ls -lh YouTubeDubber-Unsigned.ipa

      - name: Upload Compiled .ipa & Simulator .app Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDubber-iOS-Build
          path: |
            build/YouTubeDubber-Unsigned.ipa
            build/DerivedDataSimulator/Build/Products/Debug-iphonesimulator/YouTubeDubber.app
          retention-days: 30
