              /// 解析由 WKWebView 同源拦截器捕获到的原始字幕与 `&tlang=zh-Hans` 内译字幕
              func parseRawCaptionPayload(_ rawText: String, translatedRawText: String?, alreadyChinese: Bool) -> [SubtitleCue] {
                  guard let data = rawText.data(using: .utf8) else { return [] }
                  var baseCues: [SubtitleCue] = []
                  if let jsonCues = try? parseJSON3Captions(data: data, alreadyChinese: alreadyChinese), !jsonCues.isEmpty {
                      baseCues = jsonCues
                  } else {
                      baseCues = parseXMLCaptions(xml: rawText, alreadyChinese: alreadyChinese)
                  }
                  guard !baseCues.isEmpty else { return [] }

                  // 如果同时捕获到了 YouTube 官方 `&tlang=zh-Hans` 翻译结果，按时间戳对齐注入中文台词
                  if !alreadyChinese, let zhRaw = translatedRawText, let zhData = zhRaw.data(using: .utf8) {
                      let zhCues = (try? parseJSON3Captions(data: zhData, alreadyChinese: true))
                          ?? parseXMLCaptions(xml: zhRaw, alreadyChinese: true)
                      if !zhCues.isEmpty {
                          for i in 0..<baseCues.count {
                              let targetStart = baseCues[i].startTime
                              if let matched = zhCues.min(by: { abs($0.startTime - targetStart) < abs($1.startTime - targetStart) }),
                                 abs(matched.startTime - targetStart) < 1.5 {
                                  baseCues[i].translatedZH = matched.originalText
                              }
                          }
                      }
                  }
                  return mergeShortFragments(baseCues)
              }

              /// 调用 YouTube InnerTube `/youtubei/v1/player` 接口获取字幕轨道与视频作者信息
              func fetchViaInnerTube(
                  videoID: String,
                  clientName: String,
                  clientVersion: String,
                  userAgent: String,
                  preferYouTubeBuiltInTranslation: Bool
              ) async throws -> (cues: [SubtitleCue], title: String?, author: String?, channelID: String?) {
                  let url = URL(string: "https://www.youtube.com/youtubei/v1/player?prettyPrint=false")!
                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  request.setValue(userAgent, forHTTPHeaderField: "User-Agent")

                  let body: [String: Any] = [
                      "context": [
                          "client": [
                              "clientName": clientName,
                              "clientVersion": clientVersion,
                              "hl": "zh-CN",
                              "gl": "US"
                          ]
                      ],
                      "videoId": videoID
                  ]
                  request.httpBody = try JSONSerialization.data(withJSONObject: body)

                  let (data, response) = try await URLSession.shared.data(for: request)
                  guard let http = response as? HTTPURLResponse, http.statusCode == 200,
                        let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else {
                      throw TranscriptError.noCaptionsAvailable
                  }

                  let vd = root["videoDetails"] as? [String: Any]
                  let title = vd?["title"] as? String
                  let author = vd?["author"] as? String
                  let channelID = vd?["channelId"] as? String

                  guard let captions = root["captions"] as? [String: Any],
                        let renderer = captions["playerCaptionsTracklistRenderer"] as? [String: Any],
                        let rawTracks = renderer["captionTracks"] as? [[String: Any]],
                        !rawTracks.isEmpty else {
                      throw TranscriptError.noCaptionsAvailable
                  }

                  let tracks = parseTrackDictionaries(rawTracks)
                  let cues = try await downloadAndParseTrack(from: tracks, preferYouTubeBuiltInTranslation: preferYouTubeBuiltInTranslation)
                  return (cues, title, author, channelID)
              }

              /// 使用 InnerTube `/youtubei/v1/search` 与 `/youtubei/v1/next` 获取同作者其他视频与相关推荐视频
              func fetchChannelAndRelatedVideos(videoID: String, author: String, channelID: String) async -> [VideoItem] {
                  var collected: [VideoItem] = []

                  // 若已知作者名或频道，优先通过 InnerTube search 搜索该作者的代表视频
                  let queryText = !author.isEmpty ? author : channelID
                  if !queryText.isEmpty,
                     let url = URL(string: "https://www.youtube.com/youtubei/v1/search?prettyPrint=false") {
                      var req = URLRequest(url: url)
                      req.httpMethod = "POST"
                      req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                      let body: [String: Any] = [
                          "context": [
                              "client": [
                                  "clientName": "WEB",
                                  "clientVersion": "2.20250501.00.00",
                                  "hl": "zh-CN"
                              ]
                          ],
                          "query": queryText
                      ]
                      req.httpBody = try? JSONSerialization.data(withJSONObject: body)
                      if let (data, _) = try? await URLSession.shared.data(for: req),
                         let json = try? JSONSerialization.jsonObject(with: data) {
                          extractVideoRenderers(from: json, currentVideoID: videoID, currentAuthor: author, into: &collected)
                      }
                  }
                  return collected
              }

              func extractVideoRenderers(from node: Any, currentVideoID: String, currentAuthor: String, into list: inout [VideoItem]) {
                  guard list.count < 24 else { return }
                  if let dict = node as? [String: Any] {
                      if let vr = (dict["videoRenderer"] as? [String: Any]) ?? (dict["compactVideoRenderer"] as? [String: Any]),
                         let vid = vr["videoId"] as? String, vid.count == 11, vid != currentVideoID {
                          let title = extractText(from: vr["title"])
                          let byline = extractText(from: vr["ownerText"] ?? vr["shortBylineText"] ?? vr["longBylineText"])
                          let dur = extractText(from: vr["lengthText"])
                          if !title.isEmpty && !list.contains(where: { $0.videoID == vid }) {
                              let resolvedAuthor = byline.isEmpty ? currentAuthor : byline
                              let isSame = !currentAuthor.isEmpty && resolvedAuthor.lowercased().contains(currentAuthor.lowercased())
                              list.append(
                                  VideoItem(
                                      videoID: vid,
                                      title: title,
                                      author: resolvedAuthor,
                                      durationText: dur,
                                      isSameAuthor: isSame
                                  )
                              )
                          }
                      }
                      for (_, v) in dict {
                          extractVideoRenderers(from: v, currentVideoID: currentVideoID, currentAuthor: currentAuthor, into: &list)
                      }
                  } else if let arr = node as? [Any] {
                      for item in arr {
                          extractVideoRenderers(from: item, currentVideoID: currentVideoID, currentAuthor: currentAuthor, into: &list)
                      }
                  }
              }

              func extractText(from field: Any?) -> String {
                  guard let dict = field as? [String: Any] else { return "" }
                  if let simple = dict["simpleText"] as? String { return simple }
                  if let runs = dict["runs"] as? [[String: Any]] {
                      return runs.compactMap { $0["text"] as? String }.joined()
                  }
                  return ""
              }

              /// 使用括号深度平衡算法从 HTML 中完整提取 `"captionTracks":[...]`
              func extractTracksFromHTML(_ html: String) throws -> [CaptionTrackInfo] {
                  guard let markerRange = html.range(of: "\"captionTracks\":") else {
                      throw TranscriptError.noCaptionsAvailable
                  }
                  let sub = html[markerRange.upperBound...]
                  guard let openIdx = sub.firstIndex(of: "[") else {
                      throw TranscriptError.noCaptionsAvailable
                  }

                  var depth = 0
                  var inString = false
                  var escaped = false
                  var closeIdx: String.Index?

                  var idx = openIdx
                  while idx < sub.endIndex {
                      let ch = sub[idx]
                      if escaped {
                          escaped = false
                      } else if ch == "\\" {
                          escaped = true
                      } else if ch == "\"" {
                          inString.toggle()
                      } else if !inString {
                          if ch == "[" {
                              depth += 1
                          } else if ch == "]" {
                              depth -= 1
                              if depth == 0 {
                                  closeIdx = idx
                                  break
                              }
                          }
                      }
                      idx = sub.index(after: idx)
                  }

                  guard let finalIdx = closeIdx else {
                      throw TranscriptError.noCaptionsAvailable
                  }

                  let jsonArrayString = String(sub[openIdx...finalIdx])
                      .replacingOccurrences(of: "\\u0026", with: "&")
                  guard let jsonData = jsonArrayString.data(using: .utf8),
                        let rawTracks = try? JSONSerialization.jsonObject(with: jsonData) as? [[String: Any]],
                        !rawTracks.isEmpty else {
                      throw TranscriptError.noCaptionsAvailable
                  }
                  return parseTrackDictionaries(rawTracks)
              }

              func parseTrackDictionaries(_ tracks: [[String: Any]]) -> [CaptionTrackInfo] {
                  var list: [CaptionTrackInfo] = []
                  for t in tracks {
                      guard let rawUrl = t["baseUrl"] as? String else { continue }
                      let cleanUrl = rawUrl.replacingOccurrences(of: "\\u0026", with: "&")
                      let code = (t["languageCode"] as? String) ?? "en"
                      list.append(
                          CaptionTrackInfo(
                              baseUrl: cleanUrl,
                              languageCode: code,
                              isChinese: code.lowercased().hasPrefix("zh")
                          )
                      )
                  }
                  return list.sorted { a, b in
                      if a.isChinese != b.isChinese { return a.isChinese }
                      let aEn = a.languageCode.lowercased().hasPrefix("en")
                      let bEn = b.languageCode.lowercased().hasPrefix("en")
                      if aEn != bEn { return aEn }
                      return false
                  }
              }

              /// 下载字幕轨道：若开启 `preferYouTubeBuiltInTranslation` 且原轨道非中文，同时并发拉取 `&tlang=zh-Hans` 官方中文字幕
              func downloadAndParseTrack(from tracks: [CaptionTrackInfo], preferYouTubeBuiltInTranslation: Bool) async throws -> [SubtitleCue] {
                  guard let track = tracks.first else {
                      throw TranscriptError.noCaptionsAvailable
                  }

                  let json3URLString = track.baseUrl.contains("fmt=")
                      ? track.baseUrl
                      : "\(track.baseUrl)&fmt=json3"

                  var baseCues: [SubtitleCue] = []
                  if let url = URL(string: json3URLString),
                     let (data, _) = try? await URLSession.shared.data(from: url),
                     !data.isEmpty {
                      if let cues = try? parseJSON3Captions(data: data, alreadyChinese: track.isChinese), !cues.isEmpty {
                          baseCues = cues
                      } else if let str = String(data: data, encoding: .utf8) {
                          baseCues = parseXMLCaptions(xml: str, alreadyChinese: track.isChinese)
                      }
                  }

                  if baseCues.isEmpty,
                     let url = URL(string: track.baseUrl),
                     let (data, _) = try? await URLSession.shared.data(from: url),
                     let str = String(data: data, encoding: .utf8),
                     !str.isEmpty {
                      baseCues = parseXMLCaptions(xml: str, alreadyChinese: track.isChinese)
                  }

                  guard !baseCues.isEmpty else {
                      throw TranscriptError.captionParseFailed
                  }

                  // 若启用了 YouTube 官方内置翻译 (`tlang=zh-Hans`)，直接从 timedtext 拉取官方对齐的中文字幕
                  if preferYouTubeBuiltInTranslation && !track.isChinese {
                      let tlangURLString = "\(json3URLString)&tlang=zh-Hans"
                      if let tlangURL = URL(string: tlangURLString),
                         let (zhData, _) = try? await URLSession.shared.data(from: tlangURL),
                         !zhData.isEmpty {
                          let zhCues = (try? parseJSON3Captions(data: zhData, alreadyChinese: true))
                              ?? (String(data: zhData, encoding: .utf8).map { parseXMLCaptions(xml: $0, alreadyChinese: true) } ?? [])
                          if !zhCues.isEmpty {
                              for i in 0..<baseCues.count {
                                  let start = baseCues[i].startTime
                                  if let matched = zhCues.min(by: { abs($0.startTime - start) < abs($1.startTime - start) }),
                                     abs(matched.startTime - start) < 1.5 {
                                      baseCues[i].translatedZH = matched.originalText
                                  }
                              }
                          }
                      }
                  }

                  return baseCues
              }

              func parseJSON3Captions(data: Data, alreadyChinese: Bool) throws -> [SubtitleCue] {
                  guard let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                        let events = root["events"] as? [[String: Any]] else {
                      throw TranscriptError.captionParseFailed
                  }

                  var result: [SubtitleCue] = []
                  var idx = 0

                  for event in events {
                      let tStartMs = (event["tStartMs"] as? Double) ?? Double((event["tStartMs"] as? Int) ?? 0)
                      guard let segs = event["segs"] as? [[String: Any]] else { continue }
                      let dDurationMs = (event["dDurationMs"] as? Double)
                          ?? Double((event["dDurationMs"] as? Int) ?? 2500)

                      let combinedText = segs
                          .compactMap { $0["utf8"] as? String }
                          .joined()
                          .replacingOccurrences(of: "\n", with: " ")
                          .trimmingCharacters(in: .whitespacesAndNewlines)

                      guard !combinedText.isEmpty, combinedText != "[Music]", combinedText != "[Applause]" else {
                          continue
                      }

                      let decoded = decodeHTMLEntities(combinedText)
                      let cue = SubtitleCue(
                          index: idx,
                          startTime: tStartMs / 1000.0,
                          duration: max(0.8, dDurationMs / 1000.0),
                          originalText: decoded,
                          translatedZH: alreadyChinese ? decoded : nil
                      )
                      result.append(cue)
                      idx += 1
                  }
                  return result
              }

              func parseXMLCaptions(xml: String, alreadyChinese: Bool) -> [SubtitleCue] {
                  var result: [SubtitleCue] = []
                  var idx = 0

                  if let regex = try? NSRegularExpression(
                      pattern: "<text[^>]*start=\"([0-9.]+)\"(?:[^>]*dur=\"([0-9.]+)\")?[^>]*>([\\s\\S]*?)</text>",
                      options: []
                  ) {
                      let ns = xml as NSString
                      let matches = regex.matches(in: xml, options: [], range: NSRange(location: 0, length: ns.length))
                      for m in matches {
                          guard m.numberOfRanges >= 4 else { continue }
                          let startStr = ns.substring(with: m.range(at: 1))
                          let durStr = m.range(at: 2).location != NSNotFound ? ns.substring(with: m.range(at: 2)) : "2.5"
                          let rawBody = ns.substring(with: m.range(at: 3))
                          let clean = decodeHTMLEntities(stripHTMLTags(rawBody))
                              .replacingOccurrences(of: "\n", with: " ")
                              .trimmingCharacters(in: .whitespacesAndNewlines)
                          guard !clean.isEmpty, clean != "[Music]" else { continue }
                          let start = Double(startStr) ?? 0
                          let dur = max(0.8, Double(durStr) ?? 2.5)
                          result.append(
                              SubtitleCue(
                                  index: idx,
                                  startTime: start,
                                  duration: dur,
                                  originalText: clean,
                                  translatedZH: alreadyChinese ? clean : nil
                              )
                          )
                          idx += 1
                      }
                  }

                  if !result.isEmpty { return result }

                  if let pRegex = try? NSRegularExpression(
                      pattern: "<p[^>]*t=\"([0-9]+)\"(?:[^>]*d=\"([0-9]+)\")?[^>]*>([\\s\\S]*?)</p>",
                      options: []
                  ) {
                      let ns = xml as NSString
                      let matches = pRegex.matches(in: xml, options: [], range: NSRange(location: 0, length: ns.length))
                      for m in matches {
                          guard m.numberOfRanges >= 4 else { continue }
                          let tMs = Double(ns.substring(with: m.range(at: 1))) ?? 0
                          let dMs = m.range(at: 2).location != NSNotFound
                              ? (Double(ns.substring(with: m.range(at: 2))) ?? 2500)
                              : 2500
                          let rawBody = ns.substring(with: m.range(at: 3))
                          let clean = decodeHTMLEntities(stripHTMLTags(rawBody))
                              .replacingOccurrences(of: "\n", with: " ")
                              .trimmingCharacters(in: .whitespacesAndNewlines)
                          guard !clean.isEmpty, clean != "[Music]" else { continue }
                          result.append(
                              SubtitleCue(
                                  index: idx,
                                  startTime: tMs / 1000.0,
                                  duration: max(0.8, dMs / 1000.0),
                                  originalText: clean,
                                  translatedZH: alreadyChinese ? clean : nil
                              )
                          )
                          idx += 1
                      }
                  }
                  return result
              }

              func stripHTMLTags(_ str: String) -> String {
                  str.replacingOccurrences(of: "<[^>]+>", with: "", options: .regularExpression)
              }

              func decodeHTMLEntities(_ str: String) -> String {
                  str.replacingOccurrences(of: "&amp;", with: "&")
                     .replacingOccurrences(of: "&#39;", with: "'")
                     .replacingOccurrences(of: "&apos;", with: "'")
                     .replacingOccurrences(of: "&quot;", with: "\"")
                     .replacingOccurrences(of: "&lt;", with: "<")
                     .replacingOccurrences(of: "&gt;", with: ">")
                     .replacingOccurrences(of: "&#x27;", with: "'")
              }

              func mergeShortFragments(_ cues: [SubtitleCue]) -> [SubtitleCue] {
                  guard !cues.isEmpty else { return [] }
                  var merged: [SubtitleCue] = []
                  var buffer = cues[0]

                  for i in 1..<cues.count {
                      let next = cues[i]
                      let gap = next.startTime - buffer.endTime
                      let endsWithSentencePunctuation = buffer.originalText.hasSuffix(".")
                          || buffer.originalText.hasSuffix("?")
                          || buffer.originalText.hasSuffix("!")
                          || buffer.originalText.hasSuffix("。")
                          || buffer.originalText.hasSuffix("？")

                      if !endsWithSentencePunctuation && gap < 0.6 && (next.endTime - buffer.startTime) <= 7.5 {
                          let newText = buffer.originalText + " " + next.originalText
                          let newZh: String?
                          if let bZh = buffer.translatedZH, let nZh = next.translatedZH {
                              newZh = bZh + "，" + nZh
                          } else {
                              newZh = nil
                          }
                          buffer = SubtitleCue(
                              id: buffer.id,
                              index: merged.count,
                              startTime: buffer.startTime,
                              duration: next.endTime - buffer.startTime,
                              originalText: newText,
                              translatedZH: newZh
                          )
                      } else {
                          merged.append(buffer)
                          buffer = SubtitleCue(
                              id: next.id,
                              index: merged.count,
                              startTime: next.startTime,
                              duration: next.duration,
                              originalText: next.originalText,
                              translatedZH: next.translatedZH
                          )
                      }
                  }
                  merged.append(buffer)
                  return merged
              }

              /// 根据用户选择的翻译渠道批量翻译未翻译的字幕
              func translateBatchToSpokenChinese(
                  cues: [SubtitleCue],
                  provider: TranslationProvider,
                  apiKey: String,
                  baseURL: String,
                  model: String
              ) async throws -> [UUID: String] {
                  let untranslated = cues.filter { ($0.translatedZH ?? "").isEmpty }
                  guard !untranslated.isEmpty else { return [:] }

                  switch provider {
                  case .youtubeBuiltIn, .googleGTXFree:
                      return await batchGoogleGTXTranslate(cues: untranslated)
                  case .myMemoryFree:
                      let res = await myMemoryFreeTranslate(cues: untranslated)
                      return res.isEmpty ? await batchGoogleGTXTranslate(cues: untranslated) : res
                  case .siliconFlowFreeAI:
                      let sfBase = "https://api.siliconflow.cn/v1"
                      let sfModel = "Qwen/Qwen2.5-7B-Instruct"
                      if apiKey.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                          return await batchGoogleGTXTranslate(cues: untranslated)
                      }
                      return try await llmTranslateBatch(cues: untranslated, apiKey: apiKey, baseURL: sfBase, model: sfModel)
                  case .customOpenAI:
                      if apiKey.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                          return await batchGoogleGTXTranslate(cues: untranslated)
                      }
                      return try await llmTranslateBatch(cues: untranslated, apiKey: apiKey, baseURL: baseURL, model: model)
                  }
              }

              /// Google GTX 批量合并翻译：将多句字幕通过换行符拼接后单次请求返回，比逐句请求快 15~20 倍
              func batchGoogleGTXTranslate(cues: [SubtitleCue]) async -> [UUID: String] {
                  var result: [UUID: String] = [:]
                  let combined = cues.map { $0.originalText.replacingOccurrences(of: "\n", with: " ") }.joined(separator: "\n")
                  if let encoded = combined.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                     let url = URL(string: "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q=\(encoded)"),
                     let (data, _) = try? await URLSession.shared.data(from: url),
                     let arr = try? JSONSerialization.jsonObject(with: data) as? [Any],
                     let sentences = arr.first as? [[Any]] {
                      let fullTranslated = sentences.compactMap { $0.first as? String }.joined()
                      let lines = fullTranslated.components(separatedBy: "\n")
                      if lines.count == cues.count {
                          for (idx, cue) in cues.enumerated() {
                              let clean = lines[idx].trimmingCharacters(in: .whitespacesAndNewlines)
                              if !clean.isEmpty { result[cue.id] = clean }
                          }
                          return result
                      }
                  }

                  // 若多行合并后行数不一致，并发单句回退
                  for cue in cues {
                      guard let encoded = cue.originalText.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                            let url = URL(string: "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q=\(encoded)") else {
                          continue
                      }
                      if let (data, _) = try? await URLSession.shared.data(from: url),
                         let arr = try? JSONSerialization.jsonObject(with: data) as? [Any],
                         let sentences = arr.first as? [[Any]] {
                          let translated = sentences.compactMap { $0.first as? String }.joined()
                          if !translated.isEmpty {
                              result[cue.id] = translated
                          }
                      }
                  }
                  return result
              }

              /// MyMemory 开源免费翻译通道
              func myMemoryFreeTranslate(cues: [SubtitleCue]) async -> [UUID: String] {
                  var result: [UUID: String] = [:]
                  for cue in cues {
                      guard let encoded = cue.originalText.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                            let url = URL(string: "https://api.mymemory.translated.net/get?q=\(encoded)&langpair=en|zh-CN") else {
                          continue
                      }
                      if let (data, _) = try? await URLSession.shared.data(from: url),
                         let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                         let respData = json["responseData"] as? [String: Any],
                         let translated = respData["translatedText"] as? String,
                         !translated.isEmpty {
                          result[cue.id] = translated
                      }
                  }
                  return result
              }

              /// AI 大模型口语化同声传译通道（支持 SiliconFlow 免费 Qwen2.5、Groq 免费 Llama-3.3、OpenAI）
              func llmTranslateBatch(
                  cues: [SubtitleCue],
                  apiKey: String,
                  baseURL: String,
                  model: String
              ) async throws -> [UUID: String] {
                  let endpoint = URL(string: "\(baseURL.trimmingCharacters(in: CharacterSet(charactersIn: "/")))/chat/completions")!
                  var request = URLRequest(url: endpoint)
                  request.httpMethod = "POST"
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  request.setValue("Bearer \(apiKey)", forHTTPHeaderField: "Authorization")

                  let payloadLines = cues.enumerated().map { idx, cue in
                      "[\(idx)] (\(String(format: "%.1fs", cue.duration))): \(cue.originalText)"
                  }.joined(separator: "\n")

                  let systemPrompt = """
                  你是一位专业的 YouTube 视频中文同声传译配音员。
                  请将输入的每行字幕翻译为自然、流利、口语化的简体中文配音台词，字数需匹配括号内的时长以便语速自然。
                  严格按原行号格式输出：`[行号] 中文配音台词`，不要添加任何多余解释。
                  """

                  let body: [String: Any] = [
                      "model": model,
                      "temperature": 0.3,
                      "messages": [
                          ["role": "system", "content": systemPrompt],
                          ["role": "user", "content": payloadLines]
                      ]
                  ]
                  request.httpBody = try JSONSerialization.data(withJSONObject: body)

                  let (data, _) = try await URLSession.shared.data(for: request)
                  guard let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                        let choices = json["choices"] as? [[String: Any]],
                        let message = choices.first?["message"] as? [String: Any],
                        let content = message["content"] as? String else {
                      return await batchGoogleGTXTranslate(cues: cues)
                  }

                  var map: [UUID: String] = [:]
                  for line in content.components(separatedBy: .newlines) {
                      let trimmed = line.trimmingCharacters(in: .whitespaces)
                      guard trimmed.hasPrefix("["),
                            let closeIdx = trimmed.firstIndex(of: "]") else { continue }
                      let numStr = String(trimmed[trimmed.index(after: trimmed.startIndex)..<closeIdx])
                      if let idx = Int(numStr), idx >= 0, idx < cues.count {
                          let zh = String(trimmed[trimmed.index(after: closeIdx)...])
                              .trimmingCharacters(in: .whitespaces)
                          if !zh.isEmpty {
                              map[cues[idx].id] = zh
                          }
                      }
                  }
                  return map.isEmpty ? await batchGoogleGTXTranslate(cues: cues) : map
              }
          }
