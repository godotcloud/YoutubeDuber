              /// 强鲁棒性的 LLM 输出解析器：
              /// 兼容 `[0] 译文`、`**[0]** 译文`、`【0】译文`、`(0) 译文`、`0. 译文`、`1. 译文`（1-based 自动对齐）以及纯多行无编号输出！
              func parseIndexedLLMOutput(
                  content: String,
                  cues: [SubtitleCue],
                  polishStyle: DubbingPolishStyle = .aiSimultaneous,
                  videoTitle: String = "",
                  videoAuthor: String = ""
              ) -> [UUID: String] {
                  var indexedPairs: [(Int, String)] = []
                  var plainLines: [String] = []

                  let lineRegex = try? NSRegularExpression(
                      pattern: "^[\\s\\*\\-\\#]*[\\[【\\(（]?([0-9]+)[\\]】\\)）\\.\\:：、\\s]+(.*)$",
                      options: []
                  )

                  for rawLine in content.components(separatedBy: .newlines) {
                      let trimmed = rawLine
                          .replacingOccurrences(of: "**", with: "")
                          .trimmingCharacters(in: CharacterSet.whitespacesAndNewlines)
                      guard !trimmed.isEmpty,
                            !trimmed.hasPrefix("```"),
                            !trimmed.hasPrefix("【") || trimmed.range(of: "^【[0-9]+】", options: .regularExpression) != nil else {
                          continue
                      }

                      let ns = trimmed as NSString
                      if let regex = lineRegex,
                         let match = regex.firstMatch(in: trimmed, options: [], range: NSRange(location: 0, length: ns.length)),
                         match.numberOfRanges >= 3 {
                          let numStr = ns.substring(with: match.range(at: 1))
                          var textPart = ns.substring(with: match.range(at: 2)).trimmingCharacters(in: CharacterSet.whitespacesAndNewlines)
                          textPart = textPart.replacingOccurrences(of: "^\\([^\\)]*\\)\\s*[:：]?\\s*", with: "", options: .regularExpression)
                          if let idx = Int(numStr), !textPart.isEmpty {
                              indexedPairs.append((idx, textPart))
                              continue
                          }
                      }
                      plainLines.append(trimmed)
                  }

                  var map: [UUID: String] = [:]
                  if !indexedPairs.isEmpty {
                      let hasZero = indexedPairs.contains(where: { $0.0 == 0 })
                      let maxIdx = indexedPairs.map { $0.0 }.max() ?? 0
                      let isOneBased = !hasZero && maxIdx == cues.count

                      for (rawIdx, text) in indexedPairs {
                          let idx = isOneBased ? (rawIdx - 1) : rawIdx
                          if idx >= 0 && idx < cues.count {
                              map[cues[idx].id] = polishChineseByStyle(text, duration: cues[idx].duration, style: polishStyle, videoTitle: videoTitle, videoAuthor: videoAuthor)
                          }
                      }
                  }

                  if map.isEmpty && plainLines.count == cues.count {
                      for (idx, text) in plainLines.enumerated() {
                          map[cues[idx].id] = polishChineseByStyle(text, duration: cues[idx].duration, style: polishStyle, videoTitle: videoTitle, videoAuthor: videoAuthor)
                      }
                  }

                  return map
              }
