              private func computeSmoothSpeed(for cue: SubtitleCue, nextCueStartTime: TimeInterval?, actualAudioSeconds: Double? = nil) -> Double {
                  let zhText = cue.translatedZH ?? ""
                  let estimatedAudioSec = actualAudioSeconds ?? max(1.2, Double(zhText.count) / 4.2)

                  let interCueGap: TimeInterval
                  if let nextStart = nextCueStartTime, nextStart > cue.endTime {
                      interCueGap = min(1.2, nextStart - cue.endTime)
                  } else {
                      interCueGap = 0.25
                  }

                  let naturalSpan = max(1.8, (cue.duration + interCueGap) / max(0.6, latestVideoRate))
                  let rawRatio = (estimatedAudioSec / naturalSpan) * baseSpeechRateMultiplier

                  let startLag = max(0.0, (latestPlaybackTime - audioSyncOffset) - cue.startTime)
                  let gentleCatchUp = startLag > 0.4 ? min(0.05, startLag * 0.04) : 0.0

                  let minAllowed = max(0.92, baseSpeechRateMultiplier * 0.96)
                  let maxAllowed = min(1.20, baseSpeechRateMultiplier * 1.14)
                  let clampedTarget = min(maxAllowed, max(minAllowed, rawRatio + gentleCatchUp))

                  let blended = smoothedSpeechSpeed * 0.65 + clampedTarget * 0.35
                  let maxStep = 0.04
                  let stepLimited: Double
                  if blended > smoothedSpeechSpeed + maxStep {
                      stepLimited = smoothedSpeechSpeed + maxStep
                  } else if blended < smoothedSpeechSpeed - maxStep {
                      stepLimited = smoothedSpeechSpeed - maxStep
                  } else {
                      stepLimited = blended
                  }

                  smoothedSpeechSpeed = min(maxAllowed, max(minAllowed, stepLimited))
                  return smoothedSpeechSpeed
              }

              func syncWithPlayback(
                  currentTime: TimeInterval,
                  playerState: YTPlayerState,
                  videoPlaybackRate: Double,
                  cues: [SubtitleCue],
                  apiKey: String,
                  ttsBaseURL: String
              ) {
                  guard isDubbingEnabled else { return }

                  latestPlaybackTime = currentTime
                  latestVideoRate = videoPlaybackRate
                  latestPlayerState = playerState
                  latestAPIKey = apiKey
                  latestTTSBaseURL = ttsBaseURL

                  // 关键防抖：WebKit 缓冲 (.buffering) 或少于 4 帧 (<0.48s) 的瞬态状态抖动绝不中断正在朗读的配音！
                  if playerState == .buffering || playerState == .unstarted || playerState == .cued {
                      return
                  }
                  if playerState == .paused || playerState == .ended {
                      pausedTickCount += 1
                      if pausedTickCount >= 4 && isSpeaking && currentlySpeakingCue?.index != -1 {
                          stopImmediately()
                      }
                      return
                  }
                  pausedTickCount = 0

                  let effectiveTime = currentTime - audioSyncOffset

                  guard let currentIdx = cues.firstIndex(where: {
                      effectiveTime >= ($0.startTime - 0.15) && effectiveTime < $0.endTime
                  }) else {
                      return
                  }

                  let currentCue = cues[currentIdx]
                  let nextStart: TimeInterval? = (currentIdx + 1 < cues.count) ? cues[currentIdx + 1].startTime : nil
                  activeCueID = currentCue.id

                  prefetchUpcomingCues(fromIndex: currentIdx, in: cues, apiKey: apiKey, baseURL: ttsBaseURL)

                  guard lastSpokenCueID != currentCue.id else { return }
                  guard let zhText = currentCue.translatedZH, !zhText.isEmpty else { return }

                  if isSpeaking && preventMidSentenceCutoff && currentlySpeakingCue?.index != -1 {
                      pendingCue = currentCue
                      pendingNextCueStartTime = nextStart
                      if autoSlowVideoForLongSpeech {
                          onTempSpeedFactorChange?(0.84)
                      }
                      return
                  }

                  startSpeakingCue(currentCue, nextCueStartTime: nextStart)
              }

              private func startSpeakingCue(_ cue: SubtitleCue, nextCueStartTime: TimeInterval?) {
                  guard let zhText = cue.translatedZH, !zhText.isEmpty else { return }
                  playbackGeneration += 1
                  let currentGen = playbackGeneration

                  if cue.index != -1 {
                      lastSpokenCueID = cue.id
                  }
                  currentlySpeakingCue = cue
                  pendingCue = nil
                  pendingNextCueStartTime = nil

                  if synthesizer.isSpeaking {
                      synthesizer.stopSpeaking(at: .immediate)
                  }
                  if playerNode.isPlaying {
                      playerNode.stop()
                  }
                  audioPlayer?.stop()

                  // 确保 iOS 系统音频会话处于混音+自动压低原声模式 (.mixWithOthers + .duckOthers)
                  try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .default, options: [.mixWithOthers, .duckOthers])
                  try? AVAudioSession.sharedInstance().setActive(true)
                  isSpeaking = true
                  onVolumeDuckChange?(Int(duckedOriginalVolume))

                  let smoothSpeed = computeSmoothSpeed(for: cue, nextCueStartTime: nextCueStartTime)

                  switch voiceEngine {
                  case .edgeFreeNeuralTTS:
                      Task {
                          await speakViaEdgeFreeNeuralTTS(cue: cue, nextCueStartTime: nextCueStartTime, text: zhText, speed: smoothSpeed, generation: currentGen)
                      }
                  case .googleFreeStreamTTS:
                      Task {
                          await speakViaGoogleFreeTTS(cue: cue, nextCueStartTime: nextCueStartTime, text: zhText, speed: smoothSpeed, generation: currentGen)
                      }
                  case .applePremiumTTS:
                      speakViaAppleNeuralVoice(text: zhText, smoothSpeed: smoothSpeed)
                  case .webKitSpeechTTS:
                      onWebKitSpeak?(zhText, webKitVoicePreset.lang, smoothSpeed, webKitVoicePreset.pitch)
                  case .neuralCloudTTS:
                      Task {
                          await speakViaCloudNeuralTTS(
                              cue: cue,
                              nextCueStartTime: nextCueStartTime,
                              text: zhText,
                              speed: smoothSpeed,
                              apiKey: latestAPIKey,
                              baseURL: latestTTSBaseURL,
                              generation: currentGen
                          )
                      }
                  }
              }

              func handleUtteranceCompleted() {
                  if let next = pendingCue {
                      let nextStart = pendingNextCueStartTime
                      pendingCue = nil
                      pendingNextCueStartTime = nil

                      let effectiveNow = latestPlaybackTime - audioSyncOffset
                      let lagFromStart = effectiveNow - next.startTime
                      let remainingInCue = next.endTime - effectiveNow
                      if lagFromStart <= 1.8 && remainingInCue >= 0.8 {
                          startSpeakingCue(next, nextCueStartTime: nextStart)
                          return
                      }
                  }
                  isSpeaking = false
                  currentlySpeakingCue = nil
                  onVolumeDuckChange?(100)
                  onTempSpeedFactorChange?(1.0)
              }

              private func cacheKey(for cueID: UUID) -> String {
                  "\(cueID.uuidString)|\(voiceEngine.rawValue)|\(currentVoiceShortName)"
              }

              private func prefetchUpcomingCues(fromIndex idx: Int, in cues: [SubtitleCue], apiKey: String, baseURL: String) {
                  guard voiceEngine == .edgeFreeNeuralTTS || voiceEngine == .googleFreeStreamTTS || voiceEngine == .neuralCloudTTS else {
                      return
                  }
                  let lookaheadIndices = [idx, idx + 1, idx + 2].filter { $0 >= 0 && $0 < cues.count }
                  for i in lookaheadIndices {
                      let cue = cues[i]
                      guard let zh = cue.translatedZH, !zh.isEmpty else { continue }
                      let key = cacheKey(for: cue.id)
                      guard prefetchedAudioCache[key] == nil, !prefetchingKeys.contains(key) else { continue }
                      prefetchingKeys.insert(key)

                      let engine = self.voiceEngine
                      let edgeV = self.edgeVoice
                      let googleV = self.googleVoicePreset
                      let aiV = self.aiCloudVoicePreset

                      Task {
                          if let res = await Self.downloadTTSData(
                              text: zh,
                              engine: engine,
                              edgeVoice: edgeV,
                              googlePreset: googleV,
                              aiPreset: aiV,
                              apiKey: apiKey,
                              baseURL: baseURL
                          ) {
                              self.prefetchedAudioCache[key] = res
                          }
                          self.prefetchingKeys.remove(key)
                      }
                  }
              }

              /// 严格校验返回的二进制数据是否为真实可解码音频（过滤 Cloudflare HTML / JSON 报错页）
              static func isValidAudioData(_ data: Data, response: URLResponse?) -> Bool {
                  guard data.count > 256 else { return false }
                  if let mime = response?.mimeType?.lowercased() {
                      if mime.contains("html") || mime.contains("json") || mime.contains("text") || mime.contains("xml") {
                          return false
                      }
                  }
                  return (try? AVAudioPlayer(data: data)) != nil
              }

              static func downloadFreeOpenAIFMData(text: String, voice: String) async -> Data? {
                  guard Date() >= openAIFMCooldownUntil,
                        let url = URL(string: "https://www.openai.fm/api/generate") else { return nil }
                  let boundary = "Boundary-\(UUID().uuidString)"
                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.timeoutInterval = 2.6
                  request.setValue("multipart/form-data; boundary=\(boundary)", forHTTPHeaderField: "Content-Type")
                  request.setValue("https://www.openai.fm", forHTTPHeaderField: "Origin")
                  request.setValue("https://www.openai.fm/", forHTTPHeaderField: "Referer")
                  request.setValue(
                      "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1",
                      forHTTPHeaderField: "User-Agent"
                  )

                  var body = Data()
                  let fields: [(String, String)] = [
                      ("input", text),
                      ("voice", voice),
                      ("prompt", "Voice Affect: Natural, fluent, clear Mandarin Chinese narrator."),
                      ("generation", UUID().uuidString)
                  ]
                  for (k, v) in fields {
                      body.append("--\(boundary)\r\n".data(using: .utf8)!)
                      body.append("Content-Disposition: form-data; name=\"\(k)\"\r\n\r\n".data(using: .utf8)!)
                      body.append("\(v)\r\n".data(using: .utf8)!)
                  }
                  body.append("--\(boundary)--\r\n".data(using: .utf8)!)
                  request.httpBody = body

                  if let (data, resp) = try? await URLSession.shared.data(for: request),
                     let http = resp as? HTTPURLResponse, http.statusCode == 200,
                     isValidAudioData(data, response: resp) {
                      return data
                  }
                  openAIFMCooldownUntil = Date().addingTimeInterval(90)
                  return nil
              }

              /// 返回 `(data, isFallback)`：若 `isFallback == true`，播放时自动通过 `AVAudioUnitTimePitch` 施加目标音色的专属 `pitchCents`（男声/女声/地域声线），
              /// 并通过熔断器避免失效网关重复等待，确保零延迟响应与鲜明音色差异！
              static func downloadTTSData(
                  text: String,
                  engine: DubbingVoiceEngine,
                  edgeVoice: EdgeChineseVoice,
                  googlePreset: GoogleVoicePreset,
                  aiPreset: AICloudVoicePreset,
                  apiKey: String,
                  baseURL: String
              ) async -> (data: Data, isFallback: Bool)? {
                  switch engine {
                  case .edgeFreeNeuralTTS:
                      if Date() >= edgeGatewayCooldownUntil,
                         let encodedText = text.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                         let encodedVoice = edgeVoice.rawValue.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                         let url = URL(string: "https://tts.travisvn.com/?text=\(encodedText)&voice=\(encodedVoice)") {
                          var req = URLRequest(url: url)
                          req.timeoutInterval = 1.5
                          if let (data, resp) = try? await URLSession.shared.data(for: req),
                             let http = resp as? HTTPURLResponse, http.statusCode == 200,
                             isValidAudioData(data, response: resp) {
                              return (data, false)
                          }
                          edgeGatewayCooldownUntil = Date().addingTimeInterval(120)
                      }
                      if let gData = await downloadGoogleTTSData(text: text, langCode: edgeVoice.fallbackLangCode) {
                          return (gData, true)
                      }
                      return nil

                  case .googleFreeStreamTTS:
                      if let gData = await downloadGoogleTTSData(text: text, langCode: googlePreset.langCode) {
                          return (gData, true)
                      }
                      return nil

                  case .neuralCloudTTS:
                      let trimmedKey = apiKey.trimmingCharacters(in: CharacterSet.whitespacesAndNewlines)

                      if aiPreset.isOpenAIVoice {
                          if !trimmedKey.isEmpty {
                              let cleanBase = baseURL.trimmingCharacters(in: CharacterSet(charactersIn: "/"))
                              let targetBase = cleanBase.lowercased().contains("siliconflow")
                                  ? "https://api.openai.com/v1"
                                  : cleanBase
                              if let url = URL(string: "\(targetBase)/audio/speech") {
                                  var request = URLRequest(url: url)
                                  request.httpMethod = "POST"
                                  request.timeoutInterval = 4.2
                                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                                  request.setValue("Bearer \(trimmedKey)", forHTTPHeaderField: "Authorization")
                                  let payload: [String: Any] = [
                                      "model": "tts-1",
                                      "input": text,
                                      "voice": aiPreset.rawValue,
                                      "response_format": "mp3",
                                      "speed": 1.0
                                  ]
                                  request.httpBody = try? JSONSerialization.data(withJSONObject: payload)
                                  if let (data, resp) = try? await URLSession.shared.data(for: request),
                                     let http = resp as? HTTPURLResponse, http.statusCode == 200, data.count > 256 {
                                      return (data, false)
                                  }
                              }
                          }

                          if let freeOpenAIData = await downloadFreeOpenAIFMData(text: text, voice: aiPreset.rawValue) {
                              return (freeOpenAIData, false)
                          }
                      } else {
                          let cleanBase = baseURL.trimmingCharacters(in: CharacterSet(charactersIn: "/"))
                          let targetBase = cleanBase.isEmpty ? "https://api.siliconflow.cn/v1" : cleanBase
                          if !trimmedKey.isEmpty, let url = URL(string: "\(targetBase)/audio/speech") {
                              var request = URLRequest(url: url)
                              request.httpMethod = "POST"
                              request.timeoutInterval = 4.2
                              request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                              request.setValue("Bearer \(trimmedKey)", forHTTPHeaderField: "Authorization")
                              let payload: [String: Any] = [
                                  "model": "FunAudioLLM/CosyVoice2-0.5B",
                                  "input": text,
                                  "voice": aiPreset.rawValue,
                                  "response_format": "mp3",
                                  "speed": 1.0
                              ]
                              request.httpBody = try? JSONSerialization.data(withJSONObject: payload)
                              if let (data, resp) = try? await URLSession.shared.data(for: request),
                                 let http = resp as? HTTPURLResponse, http.statusCode == 200, data.count > 256 {
                                  return (data, false)
                              }
                          }
                          let mappedVoice = aiPreset.isMaleVoice ? "echo" : "nova"
                          if let freeOpenAIData = await downloadFreeOpenAIFMData(text: text, voice: mappedVoice) {
                              return (freeOpenAIData, false)
                          }
                      }

                      let fallbackEdgeVoice = aiPreset.isMaleVoice ? "zh-CN-YunxiNeural" : "zh-CN-XiaoxiaoNeural"
                      if let encodedText = text.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                         let url = URL(string: "https://tts.travisvn.com/?text=\(encodedText)&voice=\(fallbackEdgeVoice)") {
                          if let (data, resp) = try? await URLSession.shared.data(from: url),
                             let http = resp as? HTTPURLResponse, http.statusCode == 200, data.count > 256 {
                              return (data, false)
                          }
                      }
                      if let gData = await downloadGoogleTTSData(text: text, langCode: "zh-CN") {
                          return (gData, true)
                      }
                      return nil

                  default:
                      return nil
                  }
              }

              static func downloadGoogleTTSData(text: String, langCode: String) async -> Data? {
                  guard let encoded = text.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                        let url = URL(string: "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=\(langCode)&q=\(encoded)") else {
                      return nil
                  }
                  var request = URLRequest(url: url)
                  request.timeoutInterval = 3.5
                  request.setValue(
                      "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148",
                      forHTTPHeaderField: "User-Agent"
                  )
                  if let (data, resp) = try? await URLSession.shared.data(for: request),
                     let http = resp as? HTTPURLResponse, http.statusCode == 200,
                     isValidAudioData(data, response: resp) {
                      return data
                  }
                  return nil
              }

              /// 使用 AVAudioEngine + AVAudioUnitTimePitch 播放二进制音频：同时支持窄幅平稳变速与独立声学变调 (`pitchCents`)！
              private func playSynthesizedAudioData(
                  _ data: Data,
                  pitchCents: Float,
                  cue: SubtitleCue,
                  nextCueStartTime: TimeInterval?,
                  generation: Int
              ) -> Bool {
                  guard generation == playbackGeneration else { return true }

                  // 若需要施加独立音高变调 (abs(pitchCents) >= 15)，使用 AVAudioEngine + AVAudioUnitTimePitch
                  if abs(pitchCents) >= 15 {
                      let tempURL = FileManager.default.temporaryDirectory.appendingPathComponent("ytdub_\(UUID().uuidString).mp3")
                      do {
                          try data.write(to: tempURL, options: .atomic)
                          let audioFile = try AVAudioFile(forReading: tempURL)
                          let frames = AVAudioFrameCount(audioFile.length)
                          guard frames > 0,
                                let buffer = AVAudioPCMBuffer(pcmFormat: audioFile.processingFormat, frameCapacity: frames) else {
                              try? FileManager.default.removeItem(at: tempURL)
                              return false
                          }
                          try audioFile.read(into: buffer)
                          try? FileManager.default.removeItem(at: tempURL)

                          let durationSec = Double(audioFile.length) / max(1.0, audioFile.processingFormat.sampleRate)
                          let smoothRate = computeSmoothSpeed(
                              for: cue,
                              nextCueStartTime: nextCueStartTime,
                              actualAudioSeconds: max(0.6, durationSec)
                          )
                          let finalRate = min(1.18, max(0.94, smoothRate))

                          setupPitchAudioEngine()
                          if playerNode.isPlaying { playerNode.stop() }
                          if pitchAudioEngine.isRunning { pitchAudioEngine.stop() }
                          pitchAudioEngine.disconnectNodeOutput(playerNode)
                          pitchAudioEngine.disconnectNodeOutput(timePitchNode)
                          pitchAudioEngine.connect(playerNode, to: timePitchNode, format: buffer.format)
                          pitchAudioEngine.connect(timePitchNode, to: pitchAudioEngine.mainMixerNode, format: buffer.format)

                          timePitchNode.pitch = pitchCents
                          timePitchNode.rate = Float(finalRate)

                          pitchAudioEngine.prepare()
                          try pitchAudioEngine.start()

                          // 注意：AVAudioPlayerNode.scheduleBuffer 默认使用 .dataConsumed 回调（会在缓冲区送入渲染管线的 50ms 内提前触发，导致原声立刻恢复且配音被截断！）
                          // 因此使用确定性的实际播放时长计时器 (durationSec / finalRate) + generation 校验来触发完成事件！
                          playerNode.scheduleBuffer(buffer, at: nil, options: .interrupts, completionHandler: nil)
                          playerNode.play()

                          let actualPlaySeconds = max(0.28, durationSec / finalRate)
                          Task { @MainActor [weak self] in
                              try? await Task.sleep(nanoseconds: UInt64(actualPlaySeconds * 1_000_000_000))
                              guard let self = self, self.playbackGeneration == generation else { return }
                              self.handleUtteranceCompleted()
                          }

                          let projectedEnd = (latestPlaybackTime - audioSyncOffset) + (durationSec / finalRate)
                          if autoSlowVideoForLongSpeech && cue.index != -1 && projectedEnd > cue.endTime + 0.35 {
                              onTempSpeedFactorChange?(0.85)
                          }
                          return true
                      } catch {
                          try? FileManager.default.removeItem(at: tempURL)
                          // 回退到常规 AVAudioPlayer
                      }
                  }

                  do {
                      let player = try AVAudioPlayer(data: data)
                      player.delegate = self
                      player.enableRate = true

                      let smoothRate = computeSmoothSpeed(
                          for: cue,
                          nextCueStartTime: nextCueStartTime,
                          actualAudioSeconds: max(0.6, player.duration)
                      )
                      let finalRate = min(1.18, max(0.94, smoothRate))
                      player.rate = Float(finalRate)
                      player.prepareToPlay()
                      player.play()
                      self.audioPlayer = player

                      let projectedEnd = (latestPlaybackTime - audioSyncOffset) + (player.duration / finalRate)
                      if autoSlowVideoForLongSpeech && cue.index != -1 && projectedEnd > cue.endTime + 0.35 {
                          onTempSpeedFactorChange?(0.85)
                      }
                      return true
                  } catch {
                      return false
                  }
              }

              func speakViaEdgeFreeNeuralTTS(cue: SubtitleCue, nextCueStartTime: TimeInterval?, text: String, speed: Double, generation: Int) async {
                  let key = cacheKey(for: cue.id)
                  if let cached = prefetchedAudioCache[key] {
                      let cents: Float = cached.isFallback ? edgeVoice.fallbackPitchCents : 0
                      if playSynthesizedAudioData(cached.data, pitchCents: cents, cue: cue, nextCueStartTime: nextCueStartTime, generation: generation) {
                          return
                      }
                  }
                  if let downloaded = await Self.downloadTTSData(
                      text: text,
                      engine: .edgeFreeNeuralTTS,
                      edgeVoice: edgeVoice,
                      googlePreset: googleVoicePreset,
                      aiPreset: aiCloudVoicePreset,
                      apiKey: latestAPIKey,
                      baseURL: latestTTSBaseURL
                  ) {
                      prefetchedAudioCache[key] = downloaded
                      let cents: Float = downloaded.isFallback ? edgeVoice.fallbackPitchCents : 0
                      if playSynthesizedAudioData(downloaded.data, pitchCents: cents, cue: cue, nextCueStartTime: nextCueStartTime, generation: generation) {
                          return
                      }
                  }
                  guard generation == playbackGeneration else { return }
                  speakViaAppleNeuralVoice(text: text, smoothSpeed: speed, customPitchCents: edgeVoice.fallbackPitchCents)
              }

              func speakViaGoogleFreeTTS(cue: SubtitleCue, nextCueStartTime: TimeInterval?, text: String, speed: Double, generation: Int) async {
                  let key = cacheKey(for: cue.id)
                  if let cached = prefetchedAudioCache[key] {
                      if playSynthesizedAudioData(cached.data, pitchCents: googleVoicePreset.pitchCents, cue: cue, nextCueStartTime: nextCueStartTime, generation: generation) {
                          return
                      }
                  }
                  if let gData = await Self.downloadGoogleTTSData(text: text, langCode: googleVoicePreset.langCode) {
                      prefetchedAudioCache[key] = (gData, true)
                      if playSynthesizedAudioData(gData, pitchCents: googleVoicePreset.pitchCents, cue: cue, nextCueStartTime: nextCueStartTime, generation: generation) {
                          return
                      }
                  }
                  guard generation == playbackGeneration else { return }
                  speakViaAppleNeuralVoice(text: text, smoothSpeed: speed, customPitchCents: googleVoicePreset.pitchCents)
              }

              func speakViaAppleNeuralVoice(text: String, smoothSpeed: Double, customPitchCents: Float? = nil) {
                  let utterance = AVSpeechUtterance(string: text)
                  if !selectedAppleVoiceIdentifier.isEmpty,
                     let customVoice = AVSpeechSynthesisVoice(identifier: selectedAppleVoiceIdentifier) {
                      utterance.voice = customVoice
                  } else {
                      utterance.voice = Self.selectBestChineseVoice()
                  }

                  let baseRate = Double(AVSpeechUtteranceDefaultSpeechRate)
                  let mappedRate = baseRate + (smoothSpeed - 1.0) * 0.18
                  utterance.rate = Float(min(0.535, max(0.47, mappedRate)))
                  if let cents = customPitchCents {
                      let ratio = Float(pow(2.0, Double(cents) / 1200.0))
                      utterance.pitchMultiplier = max(0.72, min(1.32, ratio))
                  } else {
                      utterance.pitchMultiplier = applePitchStyle.pitchValue
                  }
                  utterance.volume = 1.0
                  utterance.preUtteranceDelay = 0.0
                  utterance.postUtteranceDelay = 0.01

                  synthesizer.speak(utterance)
              }

              func speakViaCloudNeuralTTS(
                  cue: SubtitleCue,
                  nextCueStartTime: TimeInterval?,
                  text: String,
                  speed: Double,
                  apiKey: String,
                  baseURL: String,
                  generation: Int
              ) async {
                  let key = cacheKey(for: cue.id)
                  if let cached = prefetchedAudioCache[key] {
                      let cents: Float = cached.isFallback ? aiCloudVoicePreset.fallbackPitchCents : 0
                      if playSynthesizedAudioData(cached.data, pitchCents: cents, cue: cue, nextCueStartTime: nextCueStartTime, generation: generation) {
                          return
                      }
                  }
                  if let downloaded = await Self.downloadTTSData(
                      text: text,
                      engine: .neuralCloudTTS,
                      edgeVoice: edgeVoice,
                      googlePreset: googleVoicePreset,
                      aiPreset: aiCloudVoicePreset,
                      apiKey: apiKey,
                      baseURL: baseURL
                  ) {
                      prefetchedAudioCache[key] = downloaded
                      let cents: Float = downloaded.isFallback ? aiCloudVoicePreset.fallbackPitchCents : 0
                      if playSynthesizedAudioData(downloaded.data, pitchCents: cents, cue: cue, nextCueStartTime: nextCueStartTime, generation: generation) {
                          return
                      }
                  }
                  guard generation == playbackGeneration else { return }
                  speakViaAppleNeuralVoice(text: text, smoothSpeed: speed, customPitchCents: aiCloudVoicePreset.fallbackPitchCents)
              }

              static func selectBestChineseVoice() -> AVSpeechSynthesisVoice? {
                  let zhVoices = AVSpeechSynthesisVoice.speechVoices().filter {
                      $0.language.lowercased().hasPrefix("zh-cn")
                  }
                  if let premium = zhVoices.first(where: { $0.quality == .premium }) {
                      return premium
                  }
                  if let enhanced = zhVoices.first(where: { $0.quality == .enhanced }) {
                      return enhanced
                  }
                  return AVSpeechSynthesisVoice(language: "zh-CN")
              }

              nonisolated func speechSynthesizer(
                  _ synthesizer: AVSpeechSynthesizer,
                  didFinish utterance: AVSpeechUtterance
              ) {
                  Task { @MainActor in
                      self.handleUtteranceCompleted()
                  }
              }

              nonisolated func speechSynthesizer(
                  _ synthesizer: AVSpeechSynthesizer,
                  didCancel utterance: AVSpeechUtterance
              ) {
                  Task { @MainActor in
                      if self.pendingCue == nil {
                          self.isSpeaking = false
                          self.onVolumeDuckChange?(100)
                          self.onTempSpeedFactorChange?(1.0)
                      }
                  }
              }

              nonisolated func audioPlayerDidFinishPlaying(_ player: AVAudioPlayer, successfully flag: Bool) {
                  Task { @MainActor in
                      self.handleUtteranceCompleted()
                  }
              }
          }
