              private func computeSmoothSpeed(for cue: SubtitleCue, nextCueStartTime: TimeInterval?, actualAudioSeconds: Double? = nil) -> Double {
                  let zhText = cue.translatedZH ?? ""
                  let estimatedAudioSec = actualAudioSeconds ?? max(1.2, Double(zhText.count) / 4.2)

                  let interCueGap: TimeInterval
                  if let nextStart = nextCueStartTime, nextStart > cue.endTime {
                      interCueGap = min(1.2, nextStart - cue.endTime)
                  } else {
                      interCueGap = 0.25
                  }

                  let naturalSpan = max(1.8, (cue.duration + interCueGap) / max(0.6, latestVideoRate))
                  let rawRatio = (estimatedAudioSec / naturalSpan) * baseSpeechRateMultiplier

                  let startLag = max(0.0, latestPlaybackTime - cue.startTime)
                  let gentleCatchUp = startLag > 0.4 ? min(0.05, startLag * 0.04) : 0.0

                  let minAllowed = max(0.92, baseSpeechRateMultiplier * 0.96)
                  let maxAllowed = min(1.22, baseSpeechRateMultiplier * 1.15)
                  let clampedTarget = min(maxAllowed, max(minAllowed, rawRatio + gentleCatchUp))

                  let blended = smoothedSpeechSpeed * 0.65 + clampedTarget * 0.35
                  let maxStep = 0.04
                  let stepLimited: Double
                  if blended > smoothedSpeechSpeed + maxStep {
                      stepLimited = smoothedSpeechSpeed + maxStep
                  } else if blended < smoothedSpeechSpeed - maxStep {
                      stepLimited = smoothedSpeechSpeed - maxStep
                  } else {
                      stepLimited = blended
                  }

                  smoothedSpeechSpeed = min(maxAllowed, max(minAllowed, stepLimited))
                  return smoothedSpeechSpeed
              }

              func syncWithPlayback(
                  currentTime: TimeInterval,
                  playerState: YTPlayerState,
                  videoPlaybackRate: Double,
                  cues: [SubtitleCue],
                  apiKey: String,
                  ttsBaseURL: String
              ) {
