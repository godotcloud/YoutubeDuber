                  self.onTempSpeedFactorChange = tempSpeedFactor
                  self.onWebKitSpeak = webKitSpeak
                  self.onWebKitStop = webKitStop
              }

              func stopImmediately() {
                  playbackGeneration += 1
                  pendingCue = nil
                  pendingNextCueStartTime = nil
                  currentlySpeakingCue = nil
                  smoothedSpeechSpeed = baseSpeechRateMultiplier
                  if synthesizer.isSpeaking {
                      synthesizer.stopSpeaking(at: .immediate)
                  }
                  if playerNode.isPlaying {
                      playerNode.stop()
                  }
                  audioPlayer?.stop()
                  onWebKitStop?()
                  isSpeaking = false
                  onVolumeDuckChange?(100)
                  onTempSpeedFactorChange?(1.0)
