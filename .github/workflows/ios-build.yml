                  )
                  req.setValue(buvidCookie, forHTTPHeaderField: "Cookie")

                  guard let (data, _) = try? await URLSession.shared.data(for: req),
                        let root = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                        let dataObj = root["data"] as? [String: Any],
                        let results = dataObj["result"] as? [[String: Any]] else {
                      return []
                  }

                  var items: [VideoItem] = []
                  for item in results {
                      guard let bvid = item["bvid"] as? String, !bvid.isEmpty else { continue }
                      let rawTitle = (item["title"] as? String) ?? bvid
                      let cleanTitle = decodeHTMLEntities(stripHTMLTags(rawTitle))
                      let author = (item["author"] as? String) ?? "B站UP主"
                      let duration = (item["duration"] as? String) ?? ""
                      let pic = (item["pic"] as? String) ?? ""
                      let midStr = String((item["mid"] as? Int) ?? 0)

                      items.append(
                          VideoItem(
                              platform: .bilibili,
                              videoID: bvid,
                              title: cleanTitle,
                              author: author,
                              channelID: midStr,
                              durationText: duration,
                              customCoverURL: pic
                          )
                      )
                  }
                  return items
              }

              // MARK: - 双平台字幕与视频详情入口
              func fetchMergedCues(
                  for videoID: String,
                  platform: VideoPlatform,
                  preferYouTubeBuiltInTranslation: Bool
              ) async throws -> (cues: [SubtitleCue], title: String?, author: String?, channelID: String?, coverURL: String?, channelVideos: [VideoItem]) {
                  switch platform {
                  case .youtube:
                      return try await fetchYouTubeMergedCues(for: videoID, preferYouTubeBuiltInTranslation: preferYouTubeBuiltInTranslation)
                  case .bilibili:
