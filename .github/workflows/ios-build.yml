name: iOS Build & Unsigned IPA (Zero-Unzip Standalone Workflow v2.0)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      runner_os:
        description: 'GitHub Hosted macOS Runner (macOS 14 retired on Nov 2, 2026)'
        required: true
        default: 'macos-15'
        type: choice
        options:
          - macos-15
          - macos-26
          - macos-latest

jobs:
  build-ios:
    name: Build YouTubeDubber on ${{ inputs.runner_os || 'macos-15' }}
    # 注意：GitHub Actions 已于 2026-11-02 正式退役 macos-14 镜像
    # 现默认使用 macos-15 (Xcode 16.x)，也可切换至 macos-26 或 macos-latest
    runs-on: ${{ inputs.runner_os || 'macos-15' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Bootstrap iOS Project Source Files (免解压自动写入完整工程源码 v2.0)
        run: |
          echo "正在生成/更新完整 iOS 工程源码 v2.0（免解压单 YML 构建模式）..."
          mkdir -p YouTubeDubber/Models YouTubeDubber/Services YouTubeDubber/Views
          cat << 'EOF_FILE' > project.yml
          name: YouTubeDubber
          options:
            bundleIdPrefix: com.ai.youtubedubber
            deploymentTarget:
              iOS: "17.0"
            xcodeVersion: "16.0"
            generateEmptyDirectories: true

          settings:
            base:
              SWIFT_VERSION: "5.0"
              SWIFT_STRICT_CONCURRENCY: minimal
              TARGETED_DEVICE_FAMILY: "1,2"
              IPHONEOS_DEPLOYMENT_TARGET: "17.0"

          targets:
            YouTubeDubber:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: YouTubeDubber
              info:
                path: YouTubeDubber/Info.plist
                properties:
                  CFBundleDisplayName: "YTDubber"
                  CFBundleName: "YTDubber"
                  CFBundleShortVersionString: "2.0.0"
                  CFBundleVersion: "2"
                  UILaunchScreen: {}
                  UIBackgroundModes:
                    - audio
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.ai.youtubedubber.app
                  MARKETING_VERSION: "2.0.0"
                  CURRENT_PROJECT_VERSION: "2"
                  CODE_SIGN_STYLE: Automatic
                  ENABLE_USER_SCRIPT_SANDBOXING: NO
          EOF_FILE
          cat << 'EOF_FILE' > YouTubeDubber/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleDisplayName</key>
              <string>YTDubber</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>YTDubber</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>2.0.0</string>
              <key>CFBundleVersion</key>
              <string>2</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
              </array>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF_FILE
          cat << 'EOF_FILE' > YouTubeDubber/YouTubeDubberApp.swift
          import SwiftUI
          import AVFAudio

          @main
          struct YouTubeDubberApp: App {
              init() {
                  configureAudioSession()
              }

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }

              /// 配置混合音频会话：允许 YouTube 原声与实时中文配音同时播放并支持自动压低原声 (Ducking)
              func configureAudioSession() {
                  do {
                      let session = AVAudioSession.sharedInstance()
                      try session.setCategory(
                          .playback,
                          mode: .spokenAudio,
                          options: [.mixWithOthers, .duckOthers]
                      )
                      try session.setActive(true)
                  } catch {
                      print("[AudioSession] 配置失败: \(error.localizedDescription)")
                  }
              }
          }
          EOF_FILE
          cat << 'EOF_FILE' > YouTubeDubber/Models/SubtitleCue.swift
          import Foundation

          /// 单条时间轴字幕与中文配音状态
          struct SubtitleCue: Identifiable, Equatable, Sendable {
              let id: UUID
              let index: Int
              let startTime: TimeInterval
              let duration: TimeInterval
              let originalText: String
              var translatedZH: String?
              var isDubbed: Bool = false

              var endTime: TimeInterval {
                  startTime + duration
              }

              init(
                  id: UUID = UUID(),
                  index: Int,
                  startTime: TimeInterval,
                  duration: TimeInterval,
                  originalText: String,
                  translatedZH: String? = nil
              ) {
                  self.id = id
                  self.index = index
                  self.startTime = startTime
                  self.duration = duration
                  self.originalText = originalText
                  self.translatedZH = translatedZH
              }
          }

          /// 视频元数据（用于收藏夹、当前视频信息与同作者/相关推荐视频）
          struct VideoItem: Identifiable, Codable, Equatable, Sendable {
              var id: String { videoID }
              let videoID: String
              let title: String
              let author: String
              let channelID: String
              let durationText: String
              let isSameAuthor: Bool
              let addedAt: Date

              var thumbnailURL: URL? {
                  URL(string: "https://i.ytimg.com/vi/\(videoID)/hqdefault.jpg")
              }

              init(
                  videoID: String,
                  title: String,
                  author: String,
                  channelID: String = "",
                  durationText: String = "",
                  isSameAuthor: Bool = false,
                  addedAt: Date = Date()
              ) {
                  self.videoID = videoID
                  self.title = title
                  self.author = author
                  self.channelID = channelID
                  self.durationText = durationText
                  self.isSameAuthor = isSameAuthor
                  self.addedAt = addedAt
