              func bindHandlers(
                  volumeDuck: @escaping (Int) -> Void,
                  tempSpeedFactor: @escaping (Double) -> Void,
                  webKitSpeak: @escaping (String, String, Double, Double) -> Void,
                  webKitStop: @escaping () -> Void
              ) {
                  self.onVolumeDuckChange = volumeDuck
                  self.onTempSpeedFactorChange = tempSpeedFactor
                  self.onWebKitSpeak = webKitSpeak
                  self.onWebKitStop = webKitStop
              }

              /// 用户手动拖动进度条、切换视频或暂停时立即清空队列并停止发声
              func stopImmediately() {
                  pendingCue = nil
                  currentlySpeakingCue = nil
                  if synthesizer.isSpeaking {
                      synthesizer.stopSpeaking(at: .immediate)
                  }
                  audioPlayer?.stop()
                  onWebKitStop?()
                  isSpeaking = false
                  onVolumeDuckChange?(100)
                  onTempSpeedFactorChange?(1.0)
              }

              func clearPrefetchCache() {
                  prefetchedAudioCache.removeAll()
                  prefetchingKeys.removeAll()
              }

              static func availableAppleChineseVoices() -> [AVSpeechSynthesisVoice] {
                  AVSpeechSynthesisVoice.speechVoices().filter {
                      $0.language.lowercased().hasPrefix("zh")
                  }.sorted { a, b in
                      if a.quality.rawValue != b.quality.rawValue {
                          return a.quality.rawValue > b.quality.rawValue
                      }
                      return a.name < b.name
                  }
