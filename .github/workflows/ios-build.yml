                          Section {
                              Picker("中文发音引擎", selection: $dubbingEngine.voiceEngine) {
                                  ForEach(DubbingVoiceEngine.allCases) { engine in
                                      Text(engine.rawValue).tag(engine)
                                  }
                              }

                              if dubbingEngine.voiceEngine == .edgeFreeNeuralTTS {
                                  Picker("Edge 神经主播音色", selection: $dubbingEngine.edgeVoice) {
                                      ForEach(EdgeChineseVoice.allCases) { voice in
                                          Text(voice.displayName).tag(voice)
                                      }
                                  }
                              }

                              if dubbingEngine.voiceEngine == .applePremiumTTS && !appleVoices.isEmpty {
                                  Picker("iPhone 本地中文发音人", selection: $dubbingEngine.selectedAppleVoiceIdentifier) {
                                      ForEach(appleVoices, id: \.identifier) { v in
                                          Text("\(v.name) (\(v.language))").tag(v.identifier)
                                      }
                                  }
                              }

                              VStack(alignment: .leading) {
                                  HStack {
                                      Text("原视频压音比例 (Audio Ducking)")
                                      Spacer()
                                      Text("\(Int(dubbingEngine.duckedOriginalVolume))%")
                                          .foregroundStyle(.secondary)
                                  }
                                  Slider(value: $dubbingEngine.duckedOriginalVolume, in: 0...60, step: 2)
                              }

                              VStack(alignment: .leading) {
                                  HStack {
                                      Text("基准中文语速倍率")
                                      Spacer()
                                      Text(String(format: "%.2fx", dubbingEngine.baseSpeechRateMultiplier))
                                          .foregroundStyle(.secondary)
                                  }
                                  Slider(value: $dubbingEngine.baseSpeechRateMultiplier, in: 0.9...1.35, step: 0.02)
                              }
                          } header: {
                              Text("2. 免费中文配音引擎与音色")
                          } footer: {
                              Text("• 微软 Edge 神经语音（晓晓/云希）与 Google 流式女声均支持免 Key 在线合成；若网络受限会自动无缝回退至 iPhone 本地语音，确保配音永不中断。")
                          }

                          Section {
                              HStack(spacing: 8) {
                                  Button("一键预设 SiliconFlow 免费模型") {
                                      baseURL = "https://api.siliconflow.cn/v1"
                                      llmModel = "Qwen/Qwen2.5-7B-Instruct"
                                      translationProviderRaw = TranslationProvider.siliconFlowFreeAI.rawValue
                                  }
                                  .buttonStyle(.bordered)
                                  .controlSize(.small)

                                  Button("一键预设 Groq 极速模型") {
                                      baseURL = "https://api.groq.com/openai/v1"
                                      llmModel = "llama-3.3-70b-versatile"
                                      translationProviderRaw = TranslationProvider.customOpenAI.rawValue
                                  }
                                  .buttonStyle(.bordered)
                                  .controlSize(.small)
                              }

                              SecureField("API Key (免费渠道无需填写，仅 AI 大模型使用)", text: $apiKey)
                              TextField("API Base URL", text: $baseURL)
                                  .textInputAutocapitalization(.never)
                                  .disableAutocorrection(true)
                              TextField("翻译模型名称", text: $llmModel)
                                  .textInputAutocapitalization(.never)
                                  .disableAutocorrection(true)
                          } header: {
                              Text("3. 免费 AI 大模型同传与 CosyVoice2 配音 (选填)")
                          } footer: {
                              Text("提示：硅基流动 (SiliconFlow) 提供 Qwen/Qwen2.5-7B-Instruct 免费大模型接口及 FunAudioLLM/CosyVoice2-0.5B 大模型语音合成。")
                          }
                      }
                      .navigationTitle("翻译与配音引擎设置")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .confirmationAction) {
                              Button("完成") { dismiss() }
                          }
                      }
                  }
              }
          }
          EOF_FILE

      - name: Verify macOS & Xcode Environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list devicetypes

      - name: Install XcodeGen & Generate .xcodeproj
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate --spec project.yml

      - name: Build for iOS Simulator (Debug Verification)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project YouTubeDubber.xcodeproj \
            -scheme YouTubeDubber \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedDataSimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build Unsigned iOS Device App & Package .ipa
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project YouTubeDubber.xcodeproj \
            -scheme YouTubeDubber \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p build/Payload
          cp -r build/DerivedDataDevice/Build/Products/Release-iphoneos/YouTubeDubber.app build/Payload/
          cd build
          zip -qry YouTubeDubber-Unsigned.ipa Payload
          ls -lh YouTubeDubber-Unsigned.ipa

      - name: Upload Compiled .ipa & Simulator .app Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDubber-iOS-Build
          path: |
            build/YouTubeDubber-Unsigned.ipa
            build/DerivedDataSimulator/Build/Products/Debug-iphonesimulator/YouTubeDubber.app
          retention-days: 30
