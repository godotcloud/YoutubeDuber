          import Foundation
          import WebKit
          import SwiftUI
          import AVKit

          /// 原生 iOS AirPlay 无线投屏按钮（封装 AVKit.AVRoutePickerView，支持一键投屏视频画面至 Apple TV / 智能电视 / Mac）
          struct AirPlayRoutePickerButton: UIViewRepresentable {
              func makeUIView(context: Context) -> AVRoutePickerView {
                  let picker = AVRoutePickerView(frame: CGRect(x: 0, y: 0, width: 32, height: 32))
                  picker.prioritizesVideoDevices = true
                  picker.tintColor = UIColor.label
                  picker.activeTintColor = UIColor.systemRed
                  picker.backgroundColor = .clear
                  return picker
              }

              func updateUIView(_ uiView: AVRoutePickerView, context: Context) {}
          }

          /// 负责 WKWebView 与 YouTube / Bilibili 双平台原生 HTML5 <video> 播放器、去广告、AirPlay 视频画面投屏及字幕拦截的双向通信
          @MainActor
          final class YouTubePlayerController: NSObject, ObservableObject, WKScriptMessageHandler, WKNavigationDelegate {
              @Published var currentPlatform: VideoPlatform = .youtube
              @Published var currentTime: TimeInterval = 0
              @Published var duration: TimeInterval = 0
              @Published var playerState: YTPlayerState = .unstarted
              @Published var isReady: Bool = false
              @Published var userSelectedSpeed: Double = 1.0
              @Published var playbackRate: Double = 1.0
              @Published var currentVideoID: String = "aircAruvnKk"
              @Published var currentTitle: String = "3Blue1Brown - 神经网络究竟是什么？"
              @Published var currentAuthor: String = "3Blue1Brown"
              @Published var currentChannelID: String = ""
              @Published var currentCoverURL: String = ""
              @Published var relatedVideos: [VideoItem] = []
              @Published var isCleanPlayerLayout: Bool = true

              @Published var isAdBlockEnabled: Bool = true {
                  didSet {
                      let flag = isAdBlockEnabled ? "true" : "false"
                      evaluateJS("window.__setAdBlockEnabled && window.__setAdBlockEnabled(\(flag));")
                  }
              }
              @Published var blockedAdsCount: Int = 0

              weak var webView: WKWebView?
              var onTimeTick: ((TimeInterval, YTPlayerState) -> Void)?
              var onStateChange: ((YTPlayerState) -> Void)?
              var onWebViewCaptionsCaptured: ((String, String?, Bool) -> Void)?
              var onWebKitSpeechEnded: (() -> Void)?

              static func parseInput(_ input: String) async -> (platform: VideoPlatform, videoID: String)? {
                  let trimmed = input.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !trimmed.isEmpty else { return nil }

                  if let bvMatch = extractBVID(from: trimmed) {
                      return (.bilibili, bvMatch)
                  }

                  if let b23URL = extractFirstURL(from: trimmed),
                     let host = b23URL.host?.lowercased(),
                     host.contains("b23.tv") {
                      if let resolvedBV = await resolveB23ShortLink(b23URL) {
                          return (.bilibili, resolvedBV)
                      }
                  }

                  if let ytID = extractYouTubeID(from: trimmed) {
                      return (.youtube, ytID)
                  }

                  return nil
              }

              static func extractBVID(from text: String) -> String? {
                  guard let regex = try? NSRegularExpression(pattern: "(BV[a-zA-Z0-9]{10})", options: []) else {
                      return nil
                  }
                  let ns = text as NSString
                  if let match = regex.firstMatch(in: text, options: [], range: NSRange(location: 0, length: ns.length)) {
                      return ns.substring(with: match.range(at: 1))
                  }
                  return nil
              }

              static func extractFirstURL(from text: String) -> URL? {
                  guard let detector = try? NSDataDetector(types: NSTextCheckingResult.CheckingType.link.rawValue) else {
                      return URL(string: text)
                  }
                  let ns = text as NSString
                  if let match = detector.firstMatch(in: text, options: [], range: NSRange(location: 0, length: ns.length)),
                     let url = match.url {
                      return url
                  }
                  return URL(string: text)
              }

              static func resolveB23ShortLink(_ url: URL) async -> String? {
                  var req = URLRequest(url: url)
                  req.httpMethod = "GET"
                  req.timeoutInterval = 5.0
                  if let (_, resp) = try? await URLSession.shared.data(for: req),
                     let finalURL = resp.url?.absoluteString,
                     let bv = extractBVID(from: finalURL) {
                      return bv
                  }
                  return nil
              }

              static func extractYouTubeID(from input: String) -> String? {
                  let trimmed = input.trimmingCharacters(in: .whitespacesAndNewlines)
                  if trimmed.count == 11, !trimmed.contains("/"), !trimmed.contains("?"), !trimmed.hasPrefix("BV") {
                      return trimmed
                  }
                  guard let url = extractFirstURL(from: trimmed),
                        let host = url.host?.lowercased() else { return nil }
                  if host.contains("youtu.be") {
                      let pathID = url.path.trimmingCharacters(in: CharacterSet(charactersIn: "/"))
                      if pathID.count >= 11 {
                          return String(pathID.prefix(11))
                      }
                  }
                  if host.contains("youtube.com") || host.contains("youtube-nocookie.com") {
                      if let components = URLComponents(url: url, resolvingAgainstBaseURL: false),
                         let v = components.queryItems?.first(where: { $0.name == "v" })?.value,
                         v.count >= 11 {
                          return String(v.prefix(11))
                      }
                      let parts = url.pathComponents
                      if let idx = parts.firstIndex(where: { $0 == "shorts" || $0 == "embed" || $0 == "live" || $0 == "v" }),
                         parts.count > idx + 1 {
                          let candidate = parts[idx + 1]
                          if candidate.count >= 11 {
                              return String(candidate.prefix(11))
                          }
                      }
                  }
                  return nil
              }

              func loadVideo(platform: VideoPlatform, id: String) {
                  currentPlatform = platform
                  currentVideoID = id
                  currentTime = 0
                  duration = 0

                  switch platform {
                  case .youtube:
                      guard let url = URL(string: "https://m.youtube.com/watch?v=\(id)&hl=zh-CN") else { return }
                      var request = URLRequest(url: url)
                      request.setValue("https://m.youtube.com/", forHTTPHeaderField: "Referer")
                      webView?.load(request)

                  case .bilibili:
                      // 异步解析 Bilibili 官方直连 MP4 流或 H5 专用外链播放器，彻底规避 m.bilibili.com 唤醒 App 拦截与无画面问题
                      Task { @MainActor in
                          let info = await TranscriptAndTranslationService.fetchBilibiliDirectPlayInfo(bvid: id)
                          let baseURL = URL(string: "https://www.bilibili.com/video/\(id)/")!
                          let html = Self.bilibiliPlayerHTML(bvid: id, cid: info.cid, directMP4URL: info.mp4URL)
                          self.webView?.loadHTMLString(html, baseURL: baseURL)
                      }
                  }
              }

              /// 构建带合法 `https://www.bilibili.com` 源的 Bilibili 专属 HTML5 播放器页：
              /// 优先使用直连 MP4 `<video>`（支持 100% 原生 AirPlay 视频画面投屏且零弹窗拦截），失败时自动回退至 `player.bilibili.com/player.html`
              static func bilibiliPlayerHTML(bvid: String, cid: Int, directMP4URL: String?) -> String {
                  let escapedMP4 = (directMP4URL ?? "").replacingOccurrences(of: "'", with: "\\'")
                  let iframeSrc = "https://player.bilibili.com/player.html?isOutside=true&bvid=\(bvid)&cid=\(cid)&p=1&high_quality=1&danmaku=0&autoplay=1"
                  return """
                  <!DOCTYPE html>
                  <html>
                  <head>
                      <meta charset="utf-8">
                      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
                      <meta name="referrer" content="no-referrer-when-downgrade">
                      <style>
                          html, body {
                              margin: 0; padding: 0; width: 100%; height: 100%;
                              background-color: #000; overflow: hidden;
                              display: flex; align-items: center; justify-content: center;
                          }
                          video, iframe {
                              width: 100%; height: 100%; border: 0; background: #000;
                          }
                      </style>
                  </head>
                  <body>
                      <div id="bili_mount" style="width:100%;height:100%;"></div>
                      <script>
                          (function() {
                              const mount = document.getElementById('bili_mount');
                              const mp4Url = '\(escapedMP4)';
                              const fallbackIframeUrl = '\(iframeSrc)';

                              function mountFallbackIframe() {
                                  mount.innerHTML = '';
                                  const ifr = document.createElement('iframe');
                                  ifr.src = fallbackIframeUrl;
                                  ifr.setAttribute('allow', 'autoplay; fullscreen; encrypted-media');
                                  ifr.setAttribute('allowfullscreen', 'true');
                                  mount.appendChild(ifr);
                              }

                              if (mp4Url && mp4Url.startsWith('http')) {
                                  const v = document.createElement('video');
                                  v.src = mp4Url;
                                  v.controls = true;
                                  v.autoplay = true;
                                  v.playsInline = true;
                                  v.setAttribute('playsinline', 'true');
                                  v.setAttribute('webkit-playsinline', 'true');
                                  v.setAttribute('x-webkit-airplay', 'allow');
                                  v.setAttribute('airplay', 'allow');
                                  v.disableRemotePlayback = false;
                                  v.onerror = function() {
                                      mountFallbackIframe();
                                  };
                                  mount.appendChild(v);
                                  v.play().catch(function(){});
                              } else {
                                  mountFallbackIframe();
                              }
                          })();
                      </script>
                  </body>
                  </html>
                  """
              }

              /// 拦截并阻止 Bilibili / YouTube 网页尝试唤醒外部 App (`bilibili://`, `itms-apps://` 等)，防止网页播放中断
              func webView(
                  _ webView: WKWebView,
                  decidePolicyFor navigationAction: WKNavigationAction,
                  decisionHandler: @escaping (WKNavigationActionPolicy) -> Void
              ) {
                  guard let url = navigationAction.request.url,
                        let scheme = url.scheme?.lowercased() else {
                      decisionHandler(.allow)
                      return
                  }
                  if scheme == "http" || scheme == "https" || scheme == "about" || scheme == "blob" || scheme == "data" {
                      decisionHandler(.allow)
                  } else {
                      // 阻止 bilibili://、youtube://、itms-apps:// 等跳出应用的行为
                      decisionHandler(.cancel)
                  }
              }

              func toggleCleanLayout() {
                  isCleanPlayerLayout.toggle()
                  let flag = isCleanPlayerLayout ? "true" : "false"
                  evaluateJS("window.__setCleanLayout && window.__setCleanLayout(\(flag));")
              }

              /// 触发 HTML5 <video> 原生 AirPlay 视频画面无线投屏选择器
              func triggerVideoAirPlayPicker() {
                  evaluateJS("window.__triggerAirPlay && window.__triggerAirPlay();")
              }

              func setOriginalVolume(_ volume: Int) {
                  let clamped = max(0, min(100, volume))
                  evaluateJS("window.__setYTVolume && window.__setYTVolume(\(clamped));")
              }

              func seek(to seconds: TimeInterval) {
                  let target = max(0, seconds)
                  currentTime = target
                  evaluateJS("window.__seekYT && window.__seekYT(\(target));")
              }

              func skip(by deltaSeconds: TimeInterval) {
                  let target = max(0, min(duration > 0 ? duration : 99999, currentTime + deltaSeconds))
                  seek(to: target)
              }

              func togglePlayPause() {
                  evaluateJS("window.__toggleYTPlay && window.__toggleYTPlay();")
              }

              func setPlaybackSpeed(_ speed: Double) {
                  userSelectedSpeed = speed
                  playbackRate = speed
                  evaluateJS("window.__setYTSpeed && window.__setYTSpeed(\(speed));")
              }

              func setTemporarySyncSpeedFactor(_ factor: Double) {
                  let effective = max(0.65, min(2.0, userSelectedSpeed * factor))
                  evaluateJS("window.__setYTSpeed && window.__setYTSpeed(\(effective));")
              }

              func speakViaWebKit(text: String, lang: String, rate: Double, pitch: Double) {
                  let escaped = text
                      .replacingOccurrences(of: "\\", with: "\\\\")
                      .replacingOccurrences(of: "'", with: "\\'")
                      .replacingOccurrences(of: "\n", with: " ")
                  evaluateJS("window.__speakWebKitZH && window.__speakWebKitZH('\(escaped)', '\(lang)', \(rate), \(pitch));")
              }

              func stopWebKitSpeech() {
                  evaluateJS("window.__stopWebKitZH && window.__stopWebKitZH();")
              }

              func evaluateJS(_ script: String) {
                  webView?.evaluateJavaScript(script, completionHandler: nil)
              }

              func userContentController(
                  _ userContentController: WKUserContentController,
                  didReceive message: WKScriptMessage
              ) {
                  guard message.name == "ytBridge",
                        let body = message.body as? [String: Any],
                        let event = body["event"] as? String else { return }

                  switch event {
                  case "onReady":
                      self.isReady = true
                      if let dur = body["duration"] as? Double, dur > 0 {
                          self.duration = dur
                      }
                  case "onTimeUpdate":
                      if let time = body["currentTime"] as? Double {
                          self.currentTime = time
                      }
                      if let dur = body["duration"] as? Double, dur > 0 {
                          self.duration = dur
                      }
                      if let rate = body["playbackRate"] as? Double {
                          self.playbackRate = rate
                      }
                      if let rawState = body["state"] as? Int,
                         let state = YTPlayerState(rawValue: rawState) {
                          self.playerState = state
                      }
                      self.onTimeTick?(self.currentTime, self.playerState)
                  case "onStateChange":
                      if let rawState = body["state"] as? Int,
                         let state = YTPlayerState(rawValue: rawState) {
                          self.playerState = state
                          self.onStateChange?(state)
                      }
                  case "onAdSkipped":
                      self.blockedAdsCount += 1
                  case "onWebKitSpeechEnded":
                      self.onWebKitSpeechEnded?()
                  case "onCaptionsPayload":
                      if let rawText = body["payload"] as? String, !rawText.isEmpty {
                          let isZH = (body["isChinese"] as? Bool) ?? false
                          let translatedPayload = body["translatedPayload"] as? String
                          self.onWebViewCaptionsCaptured?(rawText, translatedPayload, isZH)
                      }
                  case "onVideoMetadata":
                      if let title = body["title"] as? String, !title.isEmpty {
                          self.currentTitle = title
                      }
                      if let author = body["author"] as? String, !author.isEmpty {
                          self.currentAuthor = author
                      }
                      if let cid = body["channelId"] as? String {
                          self.currentChannelID = cid
                      }
                      if let rawList = body["related"] as? [[String: Any]] {
                          var items: [VideoItem] = []
                          for dict in rawList {
                              guard let vid = dict["videoId"] as? String, !vid.isEmpty,
                                    let title = dict["title"] as? String, !title.isEmpty else { continue }
                              let author = (dict["author"] as? String) ?? self.currentAuthor
                              let dur = (dict["duration"] as? String) ?? ""
                              let cover = (dict["cover"] as? String) ?? ""
                              let sameAuthor = (dict["isSameAuthor"] as? Bool) ?? (author == self.currentAuthor)
                              if !items.contains(where: { $0.videoID == vid }) && vid != self.currentVideoID {
                                  items.append(
                                      VideoItem(
                                          platform: self.currentPlatform,
                                          videoID: vid,
                                          title: title,
                                          author: author,
                                          channelID: self.currentChannelID,
                                          durationText: dur,
                                          customCoverURL: cover,
                                          isSameAuthor: sameAuthor
                                      )
                                  )
                              }
                          }
                          if !items.isEmpty {
                              self.relatedVideos = items
                          }
                      }
                  default:
                      break
                  }
              }
          }

          /// SwiftUI 封装的 YouTube + Bilibili 双平台网页播放器
          struct YouTubeWebPlayerView: UIViewRepresentable {
              @ObservedObject var controller: YouTubePlayerController

              func makeUIView(context: Context) -> WKWebView {
                  let contentController = WKUserContentController()
                  contentController.add(controller, name: "ytBridge")

                  let bridgeScript = WKUserScript(
                      source: Self.injectedBridgeJS(),
                      injectionTime: .atDocumentStart,
                      forMainFrameOnly: false
                  )
                  contentController.addUserScript(bridgeScript)

                  WKContentRuleListStore.default().compileContentRuleList(
                      forIdentifier: "YTDubberAdBlockRulesV2",
                      encodedContentRuleList: Self.adBlockRulesJSON()
                  ) { ruleList, _ in
                      if let ruleList = ruleList {
                          Task { @MainActor in
                              contentController.add(ruleList)
                          }
                      }
                  }

                  let config = WKWebViewConfiguration()
                  config.userContentController = contentController
                  config.allowsInlineMediaPlayback = true
                  config.allowsAirPlayForMediaPlayback = true
                  config.allowsPictureInPictureMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []

                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.navigationDelegate = controller
                  webView.customUserAgent = "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
                  webView.scrollView.isScrollEnabled = false
                  webView.isOpaque = false
                  webView.backgroundColor = .black

                  controller.webView = webView
                  controller.loadVideo(platform: controller.currentPlatform, id: controller.currentVideoID)
                  return webView
              }

              func updateUIView(_ uiView: WKWebView, context: Context) {}

              static func adBlockRulesJSON() -> String {
                  """
                  [
                    {
                      "trigger": { "url-filter": ".*(doubleclick\\.net|googlesyndication\\.com|googleadservices\\.com|youtube\\.com/api/stats/ads|youtube\\.com/pagead/|youtube\\.com/get_midroll_|cm\\.bilibili\\.com).*" },
                      "action": { "type": "block" }
                    },
                    {
                      "trigger": { "url-filter": ".*", "if-domain": ["*youtube.com"] },
                      "action": {
                        "type": "css-display-none",
                        "selector": ".video-ads, .ytp-ad-module, .ytp-ad-overlay-container, .ytp-ad-message-container, ytm-promoted-sparkles-web-renderer, ytm-promoted-video-renderer, ytm-companion-ad-renderer"
                      }
                    }
                  ]
                  """
              }

              static func injectedBridgeJS() -> String {
                  """
                  (function() {
                      if (window.__ytDubberInjected) return;
                      window.__ytDubberInjected = true;

                      // 关键：在 iOS WKWebView 中禁用 ManagedMediaSource / MediaSource (blob: 流)，
                      // 强制 YouTube 移动版下发 iOS 原生 HLS/MP4 视频流，从而让 AirPlay 投屏能够完整传输高清视频画面（彻底解决 blob: 流投屏只有声音没有画面的问题）！
                      try {
                          delete window.ManagedMediaSource;
                          delete window.MediaSource;
                          delete window.WebKitMediaSource;
                      } catch (e) {}

                      let adBlockEnabled = true;
                      window.__setAdBlockEnabled = function(enabled) {
                          adBlockEnabled = !!enabled;
                      };

                      function postToNative(payload) {
                          try {
                              if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ytBridge) {
                                  window.webkit.messageHandlers.ytBridge.postMessage(payload);
                              }
                          } catch (e) {}
                      }

                      const origFetch = window.fetch;
                      let fetchedTlangForBase = {};
                      window.fetch = async function(...args) {
                          const res = await origFetch.apply(this, args);
                          try {
                              const url = (typeof args[0] === 'string') ? args[0] : (args[0] && args[0].url) || '';
                              if (url.includes('/api/timedtext') && !url.includes('__yt_internal_tlang')) {
                                  const clone = res.clone();
                                  clone.text().then(async function(txt) {
                                      if (txt && txt.length > 20) {
                                          const isZH = url.includes('lang=zh') || url.includes('tlang=zh');
                                          let zhTranslatedTxt = null;
                                          if (!isZH && !fetchedTlangForBase[url]) {
                                              fetchedTlangForBase[url] = true;
                                              try {
                                                  const tlangUrl = url + (url.includes('?') ? '&' : '?') + 'tlang=zh-Hans&__yt_internal_tlang=1';
                                                  const zhRes = await origFetch(tlangUrl, { credentials: 'include' });
                                                  const zhBody = await zhRes.text();
                                                  if (zhBody && zhBody.length > 20) {
                                                      zhTranslatedTxt = zhBody;
                                                  }
                                              } catch (e) {}
                                          }
                                          postToNative({
                                              event: 'onCaptionsPayload',
                                              payload: txt,
                                              translatedPayload: zhTranslatedTxt,
                                              isChinese: isZH
                                          });
                                      }
                                  }).catch(function(){});
                              } else if (url.includes('aisubtitle.hdslb.com')) {
                                  const clone = res.clone();
                                  clone.text().then(function(txt) {
                                      if (txt && txt.length > 20) {
                                          postToNative({
                                              event: 'onCaptionsPayload',
                                              payload: txt,
                                              translatedPayload: null,
                                              isChinese: false
                                          });
                                      }
                                  }).catch(function(){});
                              }
                          } catch (e) {}
                          return res;
                      };

                      const origOpen = XMLHttpRequest.prototype.open;
                      XMLHttpRequest.prototype.open = function(method, url) {
                          this.__ytUrl = url;
                          return origOpen.apply(this, arguments);
                      };
                      const origSend = XMLHttpRequest.prototype.send;
                      XMLHttpRequest.prototype.send = function() {
                          this.addEventListener('load', function() {
                              try {
                                  const u = this.__ytUrl || '';
                                  const respTxt = this.responseText;
                                  if (u.includes('/api/timedtext') && !u.includes('__yt_internal_tlang') && respTxt && respTxt.length > 20) {
                                      const isZH = u.includes('lang=zh') || u.includes('tlang=zh');
                                      if (!isZH && !fetchedTlangForBase[u]) {
                                          fetchedTlangForBase[u] = true;
                                          const tlangUrl = u + (u.includes('?') ? '&' : '?') + 'tlang=zh-Hans&__yt_internal_tlang=1';
                                          origFetch(tlangUrl, { credentials: 'include' })
                                              .then(r => r.text())
                                              .then(zhBody => {
                                                  postToNative({
                                                      event: 'onCaptionsPayload',
                                                      payload: respTxt,
                                                      translatedPayload: (zhBody && zhBody.length > 20) ? zhBody : null,
                                                      isChinese: isZH
                                                  });
                                              })
                                              .catch(() => {
                                                  postToNative({
                                                      event: 'onCaptionsPayload',
                                                      payload: respTxt,
                                                      translatedPayload: null,
                                                      isChinese: isZH
                                                  });
                                              });
                                      } else {
                                          postToNative({
                                              event: 'onCaptionsPayload',
                                              payload: respTxt,
                                              translatedPayload: null,
                                              isChinese: isZH
                                          });
                                      }
                                  } else if (u.includes('aisubtitle.hdslb.com') && respTxt && respTxt.length > 20) {
                                      postToNative({
                                          event: 'onCaptionsPayload',
                                          payload: respTxt,
                                          translatedPayload: null,
                                          isChinese: false
                                      });
                                  }
                              } catch (e) {}
                          });
                          return origSend.apply(this, arguments);
                      };

                      // 仅对 YouTube 网页注入防遮挡且防挤压的纯净全屏样式：
                      // 1) 隐藏播放器内置字幕图层 (.ytp-caption-window-container / .caption-window) 及推荐侧栏 (ytm-SingleColumnWatchNextResultsRenderer)，彻底解决视频画面被内置字幕挤到一边的问题；
                      // 2) 强制 .html5-video-container 与 video 使用 position: absolute; top: 0; left: 0; width: 100%; height: 100%，覆盖 YouTube 内联 left 偏移，且不对通用 .player-container 加黑底，彻底杜绝黑屏与画面偏移！
                      let cleanLayoutEnabled = true;
                      function injectCleanCSS() {
                          if (!cleanLayoutEnabled) return;
                          if (!window.location.hostname.includes('youtube.com')) return;
                          if (document.getElementById('__yt_clean_css')) return;
                          const style = document.createElement('style');
                          style.id = '__yt_clean_css';
                          style.textContent = `
                              ytm-mobile-topbar-renderer,
                              .mobile-topbar-header,
                              #header-bar,
                              .player-placeholder,
                              .watch-below-the-player,
                              #below,
                              ytm-watch-metadata,
                              ytm-SingleColumnWatchNextResultsRenderer,
                              ytm-single-column-watch-next-results-renderer,
                              ytm-item-section-renderer,
                              ytm-slim-video-metadata-section-renderer,
                              ytm-engagement-panel-section-list-renderer,
                              ytm-transcript-section-renderer,
                              ytm-companion-slot,
                              ytm-promoted-sparkles-web-renderer,
                              .related-chips-slot-wrapper,
                              ytm-pivot-bar-renderer,
                              .ytp-caption-window-container,
                              .caption-window,
                              .ytp-caption-segment,
                              .ytm-caption-window-container,
                              .ytp-unmute,
                              .ytp-unmute-inner {
                                  display: none !important;
                                  width: 0 !important;
                                  height: 0 !important;
                                  max-width: 0 !important;
                                  max-height: 0 !important;
                                  overflow: hidden !important;
                                  pointer-events: none !important;
                              }
                              html, body, ytm-app, #app, .page-container, ytm-watch {
                                  margin: 0 !important;
                                  padding: 0 !important;
                                  top: 0 !important;
                                  left: 0 !important;
                                  width: 100vw !important;
                                  height: 100vh !important;
                                  max-width: 100vw !important;
                                  max-height: 100vh !important;
                                  min-height: 100vh !important;
                                  background: #000 !important;
                                  overflow: visible !important;
                                  transform: none !important;
                              }
                              #player-container-id, #player, .player-size, #movie_player, .html5-video-player, .html5-video-container {
                                  position: fixed !important;
                                  top: 0 !important;
                                  left: 0 !important;
