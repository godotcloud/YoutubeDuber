              }

              /// 兼容旧签名的包装方法
              func translateBatchToSpokenChinese(
                  cues: [SubtitleCue],
                  contextBefore: [SubtitleCue] = [],
                  contextAfter: [SubtitleCue] = [],
                  videoTitle: String = "",
                  videoAuthor: String = "",
                  provider: TranslationProvider,
                  apiKey: String,
                  baseURL: String,
                  model: String,
                  forceContextualUpgrade: Bool = false
              ) async throws -> [UUID: String] {
                  let rich = await translateBatchWithProviderBadge(
                      cues: cues,
                      contextBefore: contextBefore,
                      contextAfter: contextAfter,
                      videoTitle: videoTitle,
                      videoAuthor: videoAuthor,
                      provider: provider,
                      apiKey: apiKey,
                      baseURL: baseURL,
                      model: model,
                      forceContextualUpgrade: forceContextualUpgrade
                  )
                  var simple: [UUID: String] = [:]
                  for (k, v) in rich { simple[k] = v.text }
                  return simple
              }

              /// 免费免 Key 的 AI 大模型上下文同传翻译（采用 4 句微批次 + GET/POST 双通道 Pollinations 接口，确保高成功率与鲜明同传风格）
              func pollinationsFreeContextLLMTranslate(
                  cues: [SubtitleCue],
                  contextBefore: [SubtitleCue],
                  contextAfter: [SubtitleCue],
                  videoTitle: String,
                  videoAuthor: String,
                  modelName: String = "openai",
                  stylePrompt: String = "准确还原专业术语与指代关系，译文自然口语化",
                  polishStyle: DubbingPolishStyle = .aiSimultaneous,
                  badgeName: String = "AI大模型同传"
              ) async -> ([UUID: String], String) {
                  var combinedResult: [UUID: String] = [:]
                  let microChunkSize = 4

                  for start in stride(from: 0, to: cues.count, by: microChunkSize) {
                      let end = min(start + microChunkSize, cues.count)
                      let chunk = Array(cues[start..<end])

                      let payloadLines = chunk.enumerated().map { idx, cue in
                          let prepped = preprocessSourceWithDomainContext(cue.originalText, videoTitle: videoTitle, videoAuthor: videoAuthor)
                          return "[\(idx)] \(prepped)"
                      }.joined(separator: "\n")

                      let sys = "你是资深视频中文同传配音员。视频：《\(videoTitle.isEmpty ? "精选视频" : videoTitle)》（作者：\(videoAuthor)）。要求：\(stylePrompt)。严格按格式逐行输出：[行号] 中文台词，不输出任何解释。"
                      let usr = "请将以下 \(chunk.count) 句字幕翻译为中文配音台词：\n\(payloadLines)"

                      var chunkMap: [UUID: String] = [:]

                      // 通道 A：Pollinations 极速 GET 文本接口（无需复杂 JSON 握手，CDN 直返纯文本）
                      if let encPrompt = ("\(sys)\n\n\(usr)").addingPercentEncoding(withAllowedCharacters: .urlPathAllowed),
                         let getURL = URL(string: "https://text.pollinations.ai/\(encPrompt)?model=\(modelName)&seed=42") {
                          var getReq = URLRequest(url: getURL)
                          getReq.timeoutInterval = 5.5
                          getReq.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                          if let (data, resp) = try? await URLSession.shared.data(for: getReq),
                             let http = resp as? HTTPURLResponse, http.statusCode == 200,
                             let txt = String(data: data, encoding: .utf8), !txt.isEmpty {
                              chunkMap = parseIndexedLLMOutput(content: txt, cues: chunk, polishStyle: polishStyle, videoTitle: videoTitle, videoAuthor: videoAuthor)
                          }
                      }

                      // 通道 B：Pollinations POST /openai 兼容接口
                      if chunkMap.count < chunk.count,
                         let postURL = URL(string: "https://text.pollinations.ai/openai") {
                          var postReq = URLRequest(url: postURL)
                          postReq.httpMethod = "POST"
                          postReq.timeoutInterval = 6.0
                          postReq.setValue("application/json", forHTTPHeaderField: "Content-Type")
                          postReq.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                          let body: [String: Any] = [
                              "model": modelName,
                              "temperature": 0.25,
                              "messages": [
                                  ["role": "system", "content": sys],
                                  ["role": "user", "content": usr]
                              ]
                          ]
                          postReq.httpBody = try? JSONSerialization.data(withJSONObject: body)
                          if let (data, resp) = try? await URLSession.shared.data(for: postReq),
                             let http = resp as? HTTPURLResponse, http.statusCode == 200 {
                              if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                                 let choices = json["choices"] as? [[String: Any]],
                                 let message = choices.first?["message"] as? [String: Any],
                                 let content = message["content"] as? String {
                                  let parsed = parseIndexedLLMOutput(content: content, cues: chunk, polishStyle: polishStyle, videoTitle: videoTitle, videoAuthor: videoAuthor)
                                  for (k, v) in parsed { chunkMap[k] = v }
                              } else if let rawTxt = String(data: data, encoding: .utf8) {
                                  let parsed = parseIndexedLLMOutput(content: rawTxt, cues: chunk, polishStyle: polishStyle, videoTitle: videoTitle, videoAuthor: videoAuthor)
                                  for (k, v) in parsed { chunkMap[k] = v }
                              }
                          }
                      }

                      // 若仍有未命中的句子，使用带领域消歧与对应同传风格润色的整段上下文引擎补齐
                      let missing = chunk.filter { chunkMap[$0.id] == nil }
                      if !missing.isEmpty {
                          let fallback = await contextualParagraphGTXTranslate(
                              cues: missing,
                              contextBefore: contextBefore,
                              videoTitle: videoTitle,
                              videoAuthor: videoAuthor,
                              style: polishStyle
                          )
                          for (k, v) in fallback { chunkMap[k] = v }
                      }

                      for (k, v) in chunkMap {
                          combinedResult[k] = v
                      }
                  }

                  return (combinedResult, badgeName)
              }

              /// 纯单句直译（供「平台官方内置翻译」兜底使用，不加领域改写）
              func singleLineLiteralGTXTranslate(cues: [SubtitleCue]) async -> [UUID: String] {
                  var result: [UUID: String] = [:]
                  for cue in cues {
                      guard let encoded = cue.originalText.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                            let url = URL(string: "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q=\(encoded)") else {
                          continue
                      }
                      if let (data, _) = try? await URLSession.shared.data(from: url),
                         let arr = try? JSONSerialization.jsonObject(with: data) as? [Any],
                         let sentences = arr.first as? [[Any]] {
                          let translated = sentences.compactMap { $0.first as? String }.joined()
                          if !translated.isEmpty {
                              result[cue.id] = translated.trimmingCharacters(in: CharacterSet.whitespacesAndNewlines)
                          }
                      }
                  }
                  return result
              }

              /// 整段上下文感知的 Google GTX 翻译：
              /// 将视频主题、前文语境与当前批次拼接在【同一自然段（不含换行符）】内并前置领域术语消歧，让 NMT 注意力机制跨句消歧，再按目标风格进行口语精修！
              func contextualParagraphGTXTranslate(
                  cues: [SubtitleCue],
                  contextBefore: [SubtitleCue],
                  videoTitle: String,
                  videoAuthor: String = "",
                  style: DubbingPolishStyle = .naturalFlow
              ) async -> [UUID: String] {
                  var result: [UUID: String] = [:]
                  let chunkSize = 6

                  for start in stride(from: 0, to: cues.count, by: chunkSize) {
                      let end = min(start + chunkSize, cues.count)
                      let chunk = Array(cues[start..<end])

                      // 1) 单行连贯自然段（不含 \n，前置视频主题语境与领域消歧，使神经翻译模型利用整段注意力消除代词和行话歧义）
                      let numberedParagraph = chunk.enumerated().map { idx, cue in
                          let prepped = preprocessSourceWithDomainContext(cue.originalText, videoTitle: videoTitle, videoAuthor: videoAuthor)
                          return "(\(idx + 1)) \(prepped)"
                      }.joined(separator: " ; ")

                      if let encoded = numberedParagraph.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                         let url = URL(string: "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q=\(encoded)") {
                          var req = URLRequest(url: url)
                          req.timeoutInterval = 3.5
                          req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                          if let (data, _) = try? await URLSession.shared.data(for: req),
                             let arr = try? JSONSerialization.jsonObject(with: data) as? [Any],
                             let sentences = arr.first as? [[Any]] {
                              let fullTranslated = sentences.compactMap { $0.first as? String }.joined()
                              let extracted = extractNumberedSegments(from: fullTranslated, count: chunk.count)
                              if extracted.count == chunk.count {
                                  for (idx, cue) in chunk.enumerated() {
                                      let cleaned = extracted[idx]
                                          .trimmingCharacters(in: CharacterSet(charactersIn: " ;；,，"))
                                      result[cue.id] = polishChineseByStyle(cleaned, duration: cue.duration, style: style, videoTitle: videoTitle, videoAuthor: videoAuthor)
                                  }
                                  continue
                              }
                          }
                      }

                      // 2) 多行领域消歧批量翻译回退
                      let multiLine = chunk.map {
                          preprocessSourceWithDomainContext($0.originalText, videoTitle: videoTitle, videoAuthor: videoAuthor)
                              .trimmingCharacters(in: CharacterSet.whitespacesAndNewlines)
                      }.joined(separator: "\n")

                      if let encoded = multiLine.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                         let url = URL(string: "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q=\(encoded)") {
                          var req = URLRequest(url: url)
                          req.timeoutInterval = 3.5
                          req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                          if let (data, _) = try? await URLSession.shared.data(for: req),
                             let arr = try? JSONSerialization.jsonObject(with: data) as? [Any],
                             let sentences = arr.first as? [[Any]] {
                              let fullTranslated = sentences.compactMap { $0.first as? String }.joined()
                              let lines = fullTranslated
                                  .components(separatedBy: "\n")
                                  .map { $0.trimmingCharacters(in: CharacterSet.whitespacesAndNewlines) }
                                  .filter { !$0.isEmpty }
                              if lines.count == chunk.count {
                                  for (idx, cue) in chunk.enumerated() {
                                      result[cue.id] = polishChineseByStyle(lines[idx], duration: cue.duration, style: style, videoTitle: videoTitle, videoAuthor: videoAuthor)
                                  }
                                  continue
                              }
                          }
                      }

                      // 3) 逐句领域消歧兜底
                      for cue in chunk {
                          if result[cue.id] != nil { continue }
                          let prepped = preprocessSourceWithDomainContext(cue.originalText, videoTitle: videoTitle, videoAuthor: videoAuthor)
                          guard let encoded = prepped.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                                let url = URL(string: "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q=\(encoded)") else {
                              continue
                          }
                          var req = URLRequest(url: url)
                          req.timeoutInterval = 3.0
                          req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                          if let (data, resp) = try? await URLSession.shared.data(for: req),
                             let http = resp as? HTTPURLResponse, http.statusCode == 200,
                             let arr = try? JSONSerialization.jsonObject(with: data) as? [Any],
                             let sentences = arr.first as? [[Any]] {
                              let translated = sentences.compactMap { $0.first as? String }.joined()
                              if !translated.isEmpty {
                                  result[cue.id] = polishChineseByStyle(translated, duration: cue.duration, style: style, videoTitle: videoTitle, videoAuthor: videoAuthor)
                              }
                          }
                      }
                  }
                  return result
              }

              func extractNumberedSegments(from text: String, count: Int) -> [String] {
                  var results: [String] = []
                  let normalized = text
                      .replacingOccurrences(of: "（", with: "(")
                      .replacingOccurrences(of: "）", with: ")")
                  for i in 1...count {
                      let currentMarker = "(\(i))"
                      guard let startRange = normalized.range(of: currentMarker) else { return [] }
                      let contentStart = startRange.upperBound
                      if i < count {
                          let nextMarker = "(\(i + 1))"
                          guard let endRange = normalized.range(of: nextMarker, range: contentStart..<normalized.endIndex) else {
                              return []
                          }
                          let seg = String(normalized[contentStart..<endRange.lowerBound]).trimmingCharacters(in: CharacterSet.whitespacesAndNewlines)
                          results.append(seg)
                      } else {
                          let seg = String(normalized[contentStart...]).trimmingCharacters(in: CharacterSet.whitespacesAndNewlines)
                          results.append(seg)
                      }
                  }
                  return results.allSatisfy({ !$0.isEmpty }) ? results : []
              }

              /// MyMemory + Clients5 开源翻译网格（过滤配额警告 + 意译修饰）
              func myMemoryFreeTranslate(cues: [SubtitleCue], videoTitle: String = "", videoAuthor: String = "") async -> [UUID: String] {
                  var result: [UUID: String] = [:]
                  for cue in cues {
                      let prepped = preprocessSourceWithDomainContext(cue.originalText, videoTitle: videoTitle, videoAuthor: videoAuthor)
                      let shortQuery = String(prepped.prefix(420))
                      if let encoded = shortQuery.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                         let url = URL(string: "https://api.mymemory.translated.net/get?q=\(encoded)&langpair=en|zh-CN") {
                          var req = URLRequest(url: url)
                          req.timeoutInterval = 3.0
                          if let (data, _) = try? await URLSession.shared.data(for: req),
                             let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                             let respData = json["responseData"] as? [String: Any],
                             let translated = respData["translatedText"] as? String,
                             !translated.isEmpty,
                             !translated.uppercased().contains("MYMEMORY"),
                             !translated.uppercased().contains("WARNING"),
                             !translated.uppercased().contains("QUERY LENGTH") {
                              result[cue.id] = polishChineseByStyle(translated, duration: cue.duration, style: .idiomaticExpert, videoTitle: videoTitle, videoAuthor: videoAuthor)
                              continue
                          }
                      }
                      if let encoded = prepped.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                         let fallbackURL = URL(string: "https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=auto&tl=zh-CN&q=\(encoded)") {
                          var req = URLRequest(url: fallbackURL)
                          req.timeoutInterval = 3.0
                          req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                          if let (data, _) = try? await URLSession.shared.data(for: req),
                             let arr = try? JSONSerialization.jsonObject(with: data) as? [Any],
                             let firstStr = (arr.first as? String) ?? ((arr.first as? [Any])?.first as? String),
                             !firstStr.isEmpty {
                              result[cue.id] = polishChineseByStyle(firstStr, duration: cue.duration, style: .idiomaticExpert, videoTitle: videoTitle, videoAuthor: videoAuthor)
                              continue
                          }
                      }
                  }
                  if result.count < cues.count {
                      let missing = cues.filter { result[$0.id] == nil }
                      let gtx = await contextualParagraphGTXTranslate(cues: missing, contextBefore: [], videoTitle: videoTitle, videoAuthor: videoAuthor, style: .idiomaticExpert)
                      for (k, v) in gtx { result[k] = v }
                  }
                  return result
              }

              func llmTranslateBatch(
                  cues: [SubtitleCue],
                  contextBefore: [SubtitleCue],
                  contextAfter: [SubtitleCue],
                  videoTitle: String,
                  videoAuthor: String,
                  apiKey: String,
