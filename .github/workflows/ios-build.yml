                          let cleanBase = baseURL.trimmingCharacters(in: CharacterSet(charactersIn: "/"))
                          let targetBase = cleanBase.isEmpty ? "https://api.siliconflow.cn/v1" : cleanBase
                          if !trimmedKey.isEmpty, let url = URL(string: "\(targetBase)/audio/speech") {
                              var request = URLRequest(url: url)
                              request.httpMethod = "POST"
                              request.timeoutInterval = 4.5
                              request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                              request.setValue("Bearer \(trimmedKey)", forHTTPHeaderField: "Authorization")
                              let payload: [String: Any] = [
                                  "model": "FunAudioLLM/CosyVoice2-0.5B",
                                  "input": text,
                                  "voice": aiPreset.rawValue,
                                  "response_format": "mp3",
                                  "speed": 1.0
                              ]
                              request.httpBody = try? JSONSerialization.data(withJSONObject: payload)
                              if let (data, resp) = try? await URLSession.shared.data(for: request),
                                 let http = resp as? HTTPURLResponse, http.statusCode == 200, data.count > 256 {
                                  return data
                              }
                          }
                          // 若未填 SiliconFlow Key，同样通过 OpenAI.fm 提供同性别高拟真 AI 音色兜底
                          let mappedVoice = aiPreset.isMaleVoice ? "echo" : "nova"
                          if let freeOpenAIData = await downloadFreeOpenAIFMData(text: text, voice: mappedVoice) {
                              return freeOpenAIData
                          }
                      }

                      // 最终同性别神经语音兜底（保持男/女音色一致，绝不把男声切为女声）
                      let fallbackEdgeVoice = aiPreset.isMaleVoice ? "zh-CN-YunxiNeural" : "zh-CN-XiaoxiaoNeural"
                      if let encodedText = text.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                         let url = URL(string: "https://tts.travisvn.com/?text=\(encodedText)&voice=\(fallbackEdgeVoice)") {
                          if let (data, resp) = try? await URLSession.shared.data(from: url),
                             let http = resp as? HTTPURLResponse, http.statusCode == 200, data.count > 256 {
                              return data
                          }
                      }
                      return await downloadGoogleTTSData(text: text, langCode: "zh-CN")

                  default:
                      return nil
                  }
              }

              static func downloadGoogleTTSData(text: String, langCode: String) async -> Data? {
                  guard let encoded = text.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                        let url = URL(string: "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=\(langCode)&q=\(encoded)") else {
                      return nil
                  }
                  var request = URLRequest(url: url)
                  request.timeoutInterval = 3.5
                  request.setValue(
                      "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148",
                      forHTTPHeaderField: "User-Agent"
                  )
                  if let (data, resp) = try? await URLSession.shared.data(for: request),
                     let http = resp as? HTTPURLResponse, http.statusCode == 200, data.count > 256 {
                      return data
                  }
                  return nil
              }

              private func playSynthesizedAudioData(_ data: Data, cue: SubtitleCue, nextCueStartTime: TimeInterval?) -> Bool {
                  do {
                      let player = try AVAudioPlayer(data: data)
                      player.delegate = self
                      player.enableRate = true

                      let smoothRate = computeSmoothSpeed(
                          for: cue,
                          nextCueStartTime: nextCueStartTime,
                          actualAudioSeconds: max(0.6, player.duration)
                      )

                      var styleFactor = 1.0
                      if voiceEngine == .googleFreeStreamTTS {
                          if googleVoicePreset == .mandarinWarm { styleFactor = 0.96 }
                          if googleVoicePreset == .mandarinBright { styleFactor = 1.04 }
                      }

                      let finalRate = min(1.18, max(0.94, smoothRate * styleFactor))
                      player.rate = Float(finalRate)
                      player.prepareToPlay()
                      player.play()
                      self.audioPlayer = player

                      let projectedEnd = latestPlaybackTime + (player.duration / finalRate)
                      if autoSlowVideoForLongSpeech && projectedEnd > cue.endTime + 0.35 {
                          onTempSpeedFactorChange?(0.85)
                      }
                      return true
                  } catch {
                      return false
                  }
              }

              func speakViaEdgeFreeNeuralTTS(cue: SubtitleCue, nextCueStartTime: TimeInterval?, text: String, speed: Double) async {
                  let key = cacheKey(for: cue.id)
                  if let cached = prefetchedAudioCache[key] {
                      if playSynthesizedAudioData(cached, cue: cue, nextCueStartTime: nextCueStartTime) {
                          return
                      }
                  }
                  if let downloaded = await Self.downloadTTSData(
                      text: text,
                      engine: .edgeFreeNeuralTTS,
                      edgeVoice: edgeVoice,
                      googlePreset: googleVoicePreset,
                      aiPreset: aiCloudVoicePreset,
                      apiKey: latestAPIKey,
                      baseURL: latestTTSBaseURL
                  ) {
                      prefetchedAudioCache[key] = downloaded
                      if playSynthesizedAudioData(downloaded, cue: cue, nextCueStartTime: nextCueStartTime) {
                          return
                      }
                  }
                  speakViaAppleNeuralVoice(text: text, smoothSpeed: speed)
              }

              func speakViaGoogleFreeTTS(cue: SubtitleCue, nextCueStartTime: TimeInterval?, text: String, speed: Double) async {
                  let key = cacheKey(for: cue.id)
                  if let cached = prefetchedAudioCache[key] {
                      if playSynthesizedAudioData(cached, cue: cue, nextCueStartTime: nextCueStartTime) {
                          return
                      }
                  }
                  if let downloaded = await Self.downloadGoogleTTSData(text: text, langCode: googleVoicePreset.langCode) {
                      prefetchedAudioCache[key] = downloaded
                      if playSynthesizedAudioData(downloaded, cue: cue, nextCueStartTime: nextCueStartTime) {
                          return
                      }
                  }
                  speakViaAppleNeuralVoice(text: text, smoothSpeed: speed)
              }

              func speakViaAppleNeuralVoice(text: String, smoothSpeed: Double, forceMalePitch: Bool? = nil) {
                  let utterance = AVSpeechUtterance(string: text)
                  if !selectedAppleVoiceIdentifier.isEmpty,
                     let customVoice = AVSpeechSynthesisVoice(identifier: selectedAppleVoiceIdentifier) {
                      utterance.voice = customVoice
                  } else {
                      utterance.voice = Self.selectBestChineseVoice()
                  }

                  let baseRate = Double(AVSpeechUtteranceDefaultSpeechRate)
                  let mappedRate = baseRate + (smoothSpeed - 1.0) * 0.18
                  utterance.rate = Float(min(0.535, max(0.47, mappedRate)))
                  if let forceMale = forceMalePitch {
                      utterance.pitchMultiplier = forceMale ? 0.85 : 1.05
                  } else {
                      utterance.pitchMultiplier = applePitchStyle.pitchValue
                  }
                  utterance.volume = 1.0
                  utterance.preUtteranceDelay = 0.0
                  utterance.postUtteranceDelay = 0.01

                  synthesizer.speak(utterance)
              }

              func speakViaCloudNeuralTTS(
                  cue: SubtitleCue,
                  nextCueStartTime: TimeInterval?,
                  text: String,
                  speed: Double,
                  apiKey: String,
                  baseURL: String
              ) async {
                  let key = cacheKey(for: cue.id)
                  if let cached = prefetchedAudioCache[key] {
                      if playSynthesizedAudioData(cached, cue: cue, nextCueStartTime: nextCueStartTime) {
                          return
                      }
                  }
                  if let downloaded = await Self.downloadTTSData(
                      text: text,
                      engine: .neuralCloudTTS,
                      edgeVoice: edgeVoice,
                      googlePreset: googleVoicePreset,
                      aiPreset: aiCloudVoicePreset,
                      apiKey: apiKey,
                      baseURL: baseURL
                  ) {
                      prefetchedAudioCache[key] = downloaded
                      if playSynthesizedAudioData(downloaded, cue: cue, nextCueStartTime: nextCueStartTime) {
                          return
                      }
                  }
                  speakViaAppleNeuralVoice(text: text, smoothSpeed: speed, forceMalePitch: aiCloudVoicePreset.isMaleVoice)
              }

              static func selectBestChineseVoice() -> AVSpeechSynthesisVoice? {
                  let zhVoices = AVSpeechSynthesisVoice.speechVoices().filter {
                      $0.language.lowercased().hasPrefix("zh-cn")
                  }
                  if let premium = zhVoices.first(where: { $0.quality == .premium }) {
                      return premium
                  }
                  if let enhanced = zhVoices.first(where: { $0.quality == .enhanced }) {
                      return enhanced
                  }
                  return AVSpeechSynthesisVoice(language: "zh-CN")
              }

              nonisolated func speechSynthesizer(
                  _ synthesizer: AVSpeechSynthesizer,
                  didFinish utterance: AVSpeechUtterance
              ) {
                  Task { @MainActor in
                      self.handleUtteranceCompleted()
                  }
              }

              nonisolated func speechSynthesizer(
                  _ synthesizer: AVSpeechSynthesizer,
                  didCancel utterance: AVSpeechUtterance
              ) {
                  Task { @MainActor in
                      if self.pendingCue == nil {
                          self.isSpeaking = false
                          self.onVolumeDuckChange?(100)
                          self.onTempSpeedFactorChange?(1.0)
                      }
                  }
              }

              nonisolated func audioPlayerDidFinishPlaying(_ player: AVAudioPlayer, successfully flag: Bool) {
                  Task { @MainActor in
                      self.handleUtteranceCompleted()
                  }
              }
          }
