                      return edgeVoice.shortName
                  case .googleFreeStreamTTS:
                      return googleVoicePreset.shortName
                  case .applePremiumTTS:
                      if let v = AVSpeechSynthesisVoice(identifier: selectedAppleVoiceIdentifier) {
                          return v.name
                      }
                      return applePitchStyle.displayName
                  case .webKitSpeechTTS:
                      return webKitVoicePreset.shortName
                  case .neuralCloudTTS:
