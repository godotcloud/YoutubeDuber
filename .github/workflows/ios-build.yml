          import Foundation
          import AVFAudio

          /// 实时中文配音调度与合成引擎
          @MainActor
          final class RealtimeChineseDubbingEngine: NSObject, ObservableObject, AVSpeechSynthesizerDelegate, AVAudioPlayerDelegate {
              @Published var isDubbingEnabled: Bool = true
              @Published var activeCueID: UUID?
              @Published var isSpeaking: Bool = false
              @Published var voiceEngine: DubbingVoiceEngine = .applePremiumTTS
              @Published var duckedOriginalVolume: Double = 18.0
              @Published var baseSpeechRateMultiplier: Double = 1.08

              let synthesizer = AVSpeechSynthesizer()
              var audioPlayer: AVAudioPlayer?
              var lastSpokenCueID: UUID?
              var onVolumeDuckChange: ((Int) -> Void)?

              override init() {
                  super.init()
                  synthesizer.delegate = self
              }

              func bindVolumeDuckHandler(_ handler: @escaping (Int) -> Void) {
                  self.onVolumeDuckChange = handler
              }

              func stopImmediately() {
                  if synthesizer.isSpeaking {
                      synthesizer.stopSpeaking(at: .immediate)
                  }
                  audioPlayer?.stop()
                  isSpeaking = false
                  onVolumeDuckChange?(100)
              }

              func syncWithPlayback(
                  currentTime: TimeInterval,
                  playerState: YTPlayerState,
                  videoPlaybackRate: Double,
                  cues: [SubtitleCue],
                  apiKey: String,
                  ttsBaseURL: String
              ) {
                  guard isDubbingEnabled else { return }

                  if playerState != .playing {
                      if isSpeaking {
                          stopImmediately()
                      }
                      return
                  }

                  guard let currentCue = cues.first(where: {
                      currentTime >= ($0.startTime - 0.08) && currentTime < $0.endTime
                  }) else {
                      return
                  }

                  activeCueID = currentCue.id

                  guard lastSpokenCueID != currentCue.id else { return }
                  guard let zhText = currentCue.translatedZH, !zhText.isEmpty else { return }

                  lastSpokenCueID = currentCue.id
                  let remainingWindow = max(0.8, (currentCue.endTime - currentTime) / max(0.5, videoPlaybackRate))

                  speakChinese(
                      text: zhText,
                      targetDuration: remainingWindow,
                      apiKey: apiKey,
                      ttsBaseURL: ttsBaseURL
                  )
              }

              func speakChinese(
                  text: String,
                  targetDuration: TimeInterval,
                  apiKey: String,
                  ttsBaseURL: String
              ) {
                  if synthesizer.isSpeaking {
                      synthesizer.stopSpeaking(at: .immediate)
                  }
                  audioPlayer?.stop()

                  isSpeaking = true
                  onVolumeDuckChange?(Int(duckedOriginalVolume))

                  if voiceEngine == .neuralCloudTTS && !apiKey.trimmingCharacters(in: .whitespaces).isEmpty {
                      Task {
                          await speakViaCloudNeuralTTS(
                              text: text,
                              targetDuration: targetDuration,
                              apiKey: apiKey,
                              baseURL: ttsBaseURL
                          )
                      }
                  } else {
                      speakViaAppleNeuralVoice(text: text, targetDuration: targetDuration)
                  }
              }

              func speakViaAppleNeuralVoice(text: String, targetDuration: TimeInterval) {
                  let utterance = AVSpeechUtterance(string: text)
                  utterance.voice = Self.selectBestChineseVoice()

                  let charCount = Double(text.count)
                  let estimatedNormalSeconds = max(1.0, charCount / 4.2)
                  let adaptiveRatio = min(1.38, max(0.95, estimatedNormalSeconds / targetDuration)) * baseSpeechRateMultiplier

                  let defaultRate = Double(AVSpeechUtteranceDefaultSpeechRate)
                  utterance.rate = Float(min(0.62, max(0.45, defaultRate * adaptiveRatio)))
                  utterance.pitchMultiplier = 1.02
                  utterance.volume = 1.0
                  utterance.preUtteranceDelay = 0.0
                  utterance.postUtteranceDelay = 0.02

                  synthesizer.speak(utterance)
              }

              func speakViaCloudNeuralTTS(
                  text: String,
                  targetDuration: TimeInterval,
                  apiKey: String,
                  baseURL: String
              ) async {
                  let charCount = Double(text.count)
                  let estimatedSeconds = max(1.0, charCount / 4.3)
                  let speed = min(1.35, max(0.95, (estimatedSeconds / targetDuration) * baseSpeechRateMultiplier))

                  guard let url = URL(string: "\(baseURL.trimmingCharacters(in: CharacterSet(charactersIn: "/")))/audio/speech") else {
                      speakViaAppleNeuralVoice(text: text, targetDuration: targetDuration)
                      return
                  }

                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  request.setValue("Bearer \(apiKey)", forHTTPHeaderField: "Authorization")

                  let payload: [String: Any] = [
                      "model": "tts-1",
                      "input": text,
                      "voice": "nova",
                      "response_format": "aac",
                      "speed": speed
                  ]
                  request.httpBody = try? JSONSerialization.data(withJSONObject: payload)

                  do {
                      let (audioData, response) = try await URLSession.shared.data(for: request)
                      guard let http = response as? HTTPURLResponse, http.statusCode == 200 else {
                          speakViaAppleNeuralVoice(text: text, targetDuration: targetDuration)
                          return
                      }
                      let player = try AVAudioPlayer(data: audioData)
                      player.delegate = self
                      player.prepareToPlay()
                      player.play()
                      self.audioPlayer = player
                  } catch {
                      speakViaAppleNeuralVoice(text: text, targetDuration: targetDuration)
                  }
              }

              static func selectBestChineseVoice() -> AVSpeechSynthesisVoice? {
                  let zhVoices = AVSpeechSynthesisVoice.speechVoices().filter {
                      $0.language.lowercased().hasPrefix("zh-cn")
                  }
                  if let premium = zhVoices.first(where: { $0.quality == .premium }) {
                      return premium
                  }
                  if let enhanced = zhVoices.first(where: { $0.quality == .enhanced }) {
                      return enhanced
                  }
                  return AVSpeechSynthesisVoice(language: "zh-CN")
              }

              nonisolated func speechSynthesizer(
                  _ synthesizer: AVSpeechSynthesizer,
                  didFinish utterance: AVSpeechUtterance
              ) {
                  Task { @MainActor in
                      self.isSpeaking = false
                      self.onVolumeDuckChange?(100)
                  }
              }

              nonisolated func speechSynthesizer(
                  _ synthesizer: AVSpeechSynthesizer,
                  didCancel utterance: AVSpeechUtterance
              ) {
                  Task { @MainActor in
                      self.isSpeaking = false
                      self.onVolumeDuckChange?(100)
                  }
              }

              nonisolated func audioPlayerDidFinishPlaying(_ player: AVAudioPlayer, successfully flag: Bool) {
                  Task { @MainActor in
                      self.isSpeaking = false
                      self.onVolumeDuckChange?(100)
                  }
              }
          }
